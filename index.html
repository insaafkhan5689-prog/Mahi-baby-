
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101018">
<title>Mahi Baby ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#101018;--panel:#191923;--panel2:#222231;--text:#f5f3fa;--muted:#aaa8b8;--pink:#ff5d9e;--line:#30303e;--red:#ff5a69;--green:#45d69b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:#101018ed;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:21px;font-weight:800;letter-spacing:.2px}.brand span{color:var(--pink)}
.wrap{max-width:850px;margin:auto;padding:18px 14px 90px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:16px}
h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:0}
p{line-height:1.5}.muted,.small{color:var(--muted)}.small{font-size:12px}
input,textarea{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:#11111a;color:var(--text);outline:none;margin:6px 0 12px}
input:focus,textarea:focus{border-color:var(--pink)}
textarea{resize:vertical;min-height:75px}
.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--pink);color:#fff;font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:#642d39;color:#ffdce2}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
nav{display:flex;gap:7px;overflow-x:auto;padding:12px 0 16px;scrollbar-width:none}
nav button{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:10px 13px;border-radius:30px}
nav button.active{background:var(--pink);color:white;border-color:var(--pink)}
.auth{max-width:440px;margin:8vh auto;padding:18px}
.auth .panel{padding:23px}
.post{overflow:hidden;padding:0}
.post-head{display:flex;align-items:center;gap:10px;padding:13px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:800;color:var(--pink);overflow:hidden;flex-shrink:0}
.post-image{width:100%;max-height:720px;object-fit:contain;background:#08080d;display:block}
.post-body{padding:14px}
.post-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.post-actions button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 11px}
.post-actions button.selected{color:var(--pink);border-color:var(--pink)}
.comment{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.comment-form{display:flex;gap:7px;margin-top:10px}
.comment-form input{margin:0;min-width:0}
.comment-form button{flex-shrink:0}
.empty{text-align:center;padding:35px 15px;color:var(--muted)}
.status{padding:11px 13px;border-radius:10px;margin:10px 0;background:var(--panel2);color:var(--muted);font-size:14px;white-space:pre-wrap}
.status.error{color:#ff9ba5}.status.success{color:#8ce8c2}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
label{font-size:13px;color:var(--muted)}
.checkrow{display:flex;align-items:center;gap:9px;margin:8px 0 14px}
.checkrow input{width:auto;margin:0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
@media(min-width:650px){.wrap{padding-top:25px}.post-image{max-height:780px}}
</style>
</head>
<body>

<header>
  <div class="brand">Mahi Baby <span>❤️</span></div>
  <button class="btn secondary hidden" id="logoutBtn">Logout</button>
</header>

<div id="authScreen" class="auth">
  <div class="panel">
    <h2>Welcome ❤️</h2>
    <p class="muted">Login or create your account to continue.</p>
    <div id="authStatus" class="status hidden"></div>

    <form id="loginForm">
      <h3>Login</h3>
      <input id="loginEmail" type="email" placeholder="Email address" autocomplete="email" required>
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn" type="submit" style="width:100%">Login</button>
    </form>

    <hr>

    <form id="signupForm">
      <h3>Create account</h3>
      <input id="signupName" type="text" placeholder="Your display name" maxlength="50" required>
      <input id="signupEmail" type="email" placeholder="Email address" autocomplete="email" required>
      <input id="signupPassword" type="password" placeholder="Password (minimum 6 characters)" minlength="6" required>
      <button class="btn secondary" type="submit" style="width:100%">Create account</button>
    </form>

    <hr>
    <button id="forgotBtn" class="btn ghost" style="width:100%">Forgot password?</button>
  </div>
</div>

<div id="resetScreen" class="auth hidden">
  <div class="panel">
    <h2>Set new password</h2>
    <p class="muted">Enter your new password below.</p>
    <div id="resetStatus" class="status hidden"></div>
    <form id="resetForm">
      <input id="newPassword" type="password" minlength="6" placeholder="New password" required>
      <input id="confirmPassword" type="password" minlength="6" placeholder="Confirm new password" required>
      <button class="btn" type="submit" style="width:100%">Update password</button>
    </form>
  </div>
</div>

<main id="appScreen" class="wrap hidden">
  <div id="globalStatus" class="status hidden"></div>

  <nav id="mainNav">
    <button class="active" data-view="feed">Feed</button>
    <button data-view="upload">Upload</button>
    <button data-view="favorites">Favourites</button>
    <button data-view="profile">Profile</button>
    <button data-view="notifications">Notifications</button>
  </nav>

  <section id="feedView">
    <div class="row" style="margin-bottom:13px">
      <h2>Latest memories ✨</h2>
      <button class="btn secondary" id="refreshBtn">Refresh</button>
    </div>
    <div id="feedList"></div>
  </section>

  <section id="uploadView" class="hidden">
    <div class="panel">
      <h2>Share a memory 📸</h2>
      <p class="muted small">Image files only. Maximum size: 10 MB.</p>
      <div id="uploadStatus" class="status hidden"></div>
      <form id="uploadForm">
        <label for="photoFile">Choose photo</label>
        <input id="photoFile" type="file" accept="image/*" required>
        <label for="photoCaption">Caption</label>
        <textarea id="photoCaption" maxlength="1000" placeholder="Write something..."></textarea>
        <button class="btn" type="submit">Upload photo</button>
      </form>
    </div>
  </section>

  <section id="favoritesView" class="hidden">
    <h2>Your favourites ❤️</h2>
    <div id="favoritesList"></div>
  </section>

  <section id="profileView" class="hidden">
    <div class="panel">
      <h2>Your profile</h2>
      <div id="profileStatus" class="status hidden"></div>
      <form id="profileForm">
        <label>Display name</label>
        <input id="profileName" maxlength="50" required>
        <label>Username (3–24 letters, numbers or underscore)</label>
        <input id="profileUsername" maxlength="24" placeholder="your_username">
        <label>Bio</label>
        <textarea id="profileBio" maxlength="300"></textarea>
        <label>Website</label>
        <input id="profileWebsite" type="url" placeholder="https://example.com">
        <label class="checkrow"><input id="profilePrivate" type="checkbox"> Make my profile private</label>
        <button class="btn" type="submit">Save profile</button>
      </form>
      <hr>
      <p class="small muted" id="profileEmail"></p>
    </div>
  </section>

  <section id="notificationsView" class="hidden">
    <div class="row">
      <h2>Notifications 🔔</h2>
      <button class="btn secondary" id="refreshNotifications">Refresh</button>
    </div>
    <div id="notificationsList"></div>
  </section>
</main>

<footer>Mahi Baby ❤️ · Made with love</footer>

<script>
(() => {
'use strict';

const SUPABASE_URL = 'https://jhvmqedhxkahjroyquty.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ItB77qS23ODZE5xlTCs5Xw_7AFljOyX';
const BUCKET = 'Mahi baby';
const ADMIN_UID = '6b19250a-ab16-4e98-bae6-2f6473d8a4cb';
const MAX_IMAGE_SIZE = 10 * 1024 * 1024;

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let isAdmin = false;
let posts = [];
let profiles = {};
let myLikes = new Set();
let myFavorites = new Set();
let activeView = 'feed';
let bootingUser = null;

const $ = id => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[char]);
}

function showStatus(id, message, type='') {
  const el = $(id);
  if (!el) return;
  el.textContent = message;
  el.className = 'status' + (type ? ' ' + type : '');
  el.classList.remove('hidden');
}

function hideStatus(id) {
  const el = $(id);
  if (el) el.classList.add('hidden');
}

function errorMessage(error) {
  return error?.message || 'Something went wrong. Please try again.';
}

function setBusy(form, busy, buttonText='Please wait...') {
  const button = form?.querySelector('button[type="submit"]');
  if (!button) return;
  if (busy) {
    button.dataset.originalText = button.textContent;
    button.textContent = buttonText;
    button.disabled = true;
  } else {
    button.textContent = button.dataset.originalText || 'Submit';
    button.disabled = false;
  }
}

function setScreen(screen) {
  ['authScreen','resetScreen','appScreen'].forEach(id => $(id).classList.add('hidden'));
  $(screen).classList.remove('hidden');
  $('logoutBtn').classList.toggle('hidden', screen !== 'appScreen');
}

function logActivity(action, details='') {
  if (!currentUser) return;
  db.from('activity_logs').insert({
    user_id: currentUser.id,
    action,
    details
  }).then(({error}) => {
    if (error) console.warn('Activity log:', error.message);
  });
}

function getDisplayName(userId) {
  return profiles[userId]?.display_name || 'User';
}

function getInitial(name) {
  return (name || 'U').trim().charAt(0).toUpperCase() || 'U';
}

async function getImageUrl(path) {
  if (!path) return '';
  const {data, error} = await db.storage.from(BUCKET).createSignedUrl(path, 3600);
  if (error) {
    console.warn('Image URL error:', error.message);
    return '';
  }
  return data?.signedUrl || '';
}

async function checkAdmin() {
  if (!currentUser) return false;
  if (currentUser.id === ADMIN_UID) return true;

  const {data, error} = await db.from('admins')
    .select('user_id')
    .eq('user_id', currentUser.id)
    .maybeSingle();

  if (error) console.warn('Admin check:', error.message);
  return !!data;
}

async function loadProfileData() {
  const {data, error} = await db.from('profiles')
    .select('user_id,display_name,username,bio,website,is_private,avatar_path')
    .eq('user_id', currentUser.id)
    .maybeSingle();

  if (error) throw error;

  if (!data) {
    const name = currentUser.user_metadata?.display_name || 'User';
    const {data: created, error: createError} = await db.from('profiles')
      .insert({user_id:currentUser.id, display_name:name})
      .select()
      .single();

    if (createError) throw createError;
    return created;
  }
  return data;
}

async function enterApp(user) {
  if (!user) {
    currentUser = null;
    isAdmin = false;
    setScreen('authScreen');
    return;
  }

  if (bootingUser === user.id && !$('appScreen').classList.contains('hidden')) return;
  bootingUser = user.id;
  currentUser = user;
  setScreen('appScreen');
  showStatus('globalStatus','Loading your account...');

  try {
    isAdmin = await checkAdmin();
    const profile = await loadProfileData();
    profiles[user.id] = profile;
    fillProfileForm(profile);
    await loadFeed();
    await loadNotifications();
    hideStatus('globalStatus');
    showView('feed');
  } catch (error) {
    showStatus('globalStatus','Account loaded with an issue: ' + errorMessage(error),'error');
  } finally {
    bootingUser = null;
  }
}

function fillProfileForm(profile) {
  $('profileName').value = profile?.display_name || '';
  $('profileUsername').value = profile?.username || '';
  $('profileBio').value = profile?.bio || '';
  $('profileWebsite').value = profile?.website || '';
  $('profilePrivate').checked = !!profile?.is_private;
  $('profileEmail').textContent = currentUser?.email || '';
}

function showView(view) {
  activeView = view;
  const views = ['feed','upload','favorites','profile','notifications'];
  views.forEach(name => $(name+'View').classList.toggle('hidden', name !== view));
  document.querySelectorAll('#mainNav button').forEach(button => {
    button.classList.toggle('active', button.dataset.view === view);
  });

  if (view === 'favorites') renderFavorites();
  if (view === 'profile' && currentUser) fillProfileForm(profiles[currentUser.id]);
  if (view === 'notifications') loadNotifications();
}

async function loadFeed() {
  if (!currentUser) return;
  $('feedList').innerHTML = '<div class="empty">Loading photos...</div>';

  const {data:postRows, error:postError} = await db.from('photo_posts')
    .select('id,user_id,storage_path,caption,created_at')
    .order('created_at',{ascending:false})
    .limit(100);

  if (postError) {
    $('feedList').innerHTML = '';
    showStatus('globalStatus','Could not load feed: '+errorMessage(postError),'error');
    return;
  }

  posts = postRows || [];
  if (!posts.length) {
    $('feedList').innerHTML = '<div class="panel empty">No photos yet. Upload the first memory! ❤️</div>';
    return;
  }

  const userIds = [...new Set(posts.map(post => post.user_id))];
  const postIds = posts.map(post => post.id);

  const [profileResult, likeResult, favoriteResult, commentResult] = await Promise.all([
    db.from('profiles').select('user_id,display_name,username,avatar_path').in('user_id',userIds),
    db.from('photo_likes').select('id,post_id,user_id').in('post_id',postIds),
    db.from('photo_favorites').select('id,post_id,user_id').eq('user_id',currentUser.id).in('post_id',postIds),
    db.from('photo_comments').select('id,post_id').in('post_id',postIds)
  ]);

  if (profileResult.error) console.warn(profileResult.error.message);
  if (likeResult.error) console.warn(likeResult.error.message);
  if (favoriteResult.error) console.warn(favoriteResult.error.message);
  if (commentResult.error) console.warn(commentResult.error.message);

  (profileResult.data || []).forEach(profile => profiles[profile.user_id] = profile);
  myLikes = new Set((likeResult.data || []).filter(row => row.user_id === currentUser.id).map(row => row.post_id));
  myFavorites = new Set((favoriteResult.data || []).map(row => row.post_id));

  const likeCounts = {};
  const commentCounts = {};
  (likeResult.data || []).forEach(row => likeCounts[row.post_id] = (likeCounts[row.post_id] || 0) + 1);
  (commentResult.data || []).forEach(row => commentCounts[row.post_id] = (commentCounts[row.post_id] || 0) + 1);

  const html = await Promise.all(posts.map(async post => {
    const imageUrl = await getImageUrl(post.storage_path);
    const owner = profiles[post.user_id] || {};
    const name = owner.display_name || 'User';
    const date = post.created_at ? new Date(post.created_at).toLocaleString() : '';
    return `
      <article class="panel post" data-post="${escapeHTML(post.id)}">
        <div class="post-head">
          <div class="avatar">${escapeHTML(getInitial(name))}</div>
          <div style="min-width:0">
            <strong>${escapeHTML(name)}</strong>
            <div class="small muted">${escapeHTML(owner.username ? '@'+owner.username : date)}</div>
          </div>
          ${isAdmin ? `<div style="margin-left:auto"><button class="btn danger" data-action="delete-post" data-id="${escapeHTML(post.id)}">Delete</button></div>` : ''}
        </div>
        ${imageUrl ? `<img class="post-image" src="${escapeHTML(imageUrl)}" alt="Photo" loading="lazy">` : '<div class="empty">Image could not be loaded.</div>'}
        <div class="post-body">
          ${post.caption ? `<p>${escapeHTML(post.caption)}</p>` : ''}
          <div class="small muted">${escapeHTML(date)}</div>
          <div class="post-actions">
            <button data-action="like" data-id="${escapeHTML(post.id)}" class="${myLikes.has(post.id)?'selected':''}">${myLikes.has(post.id)?'❤️ Liked':'♡ Like'} · ${likeCounts[post.id]||0}</button>
            <button data-action="favorite" data-id="${escapeHTML(post.id)}" class="${myFavorites.has(post.id)?'selected':''}">${myFavorites.has(post.id)?'★ Saved':'☆ Save'}</button>
            <button data-action="toggle-comments" data-id="${escapeHTML(post.id)}">Comments · ${commentCounts[post.id]||0}</button>
          </div>
          <div class="comments-area hidden" id="comments-${escapeHTML(post.id)}">
            <div class="comments-list">Loading comments...</div>
            <form class="comment-form" data-post="${escapeHTML(post.id)}">
              <input name="content" maxlength="1000" placeholder="Write a comment..." required>
              <button class="btn" type="submit">Send</button>
            </form>
          </div>
        </div>
      </article>`;
  }));

  $('feedList').innerHTML = html.join('');
}

async function renderFavorites() {
  if (!currentUser) return;
  $('favoritesList').innerHTML = '<div class="empty">Loading favourites...</div>';

  const {data, error} = await db.from('photo_favorites')
    .select('post_id')
    .eq('user_id',currentUser.id);

  if (error) {
    $('favoritesList').innerHTML = '';
    showStatus('globalStatus','Could not load favourites: '+errorMessage(error),'error');
    return;
  }

  const ids = (data || []).map(row => row.post_id);
  const favoritePosts = posts.filter(post => ids.includes(post.id));

  if (!favoritePosts.length) {
    $('favoritesList').innerHTML = '<div class="panel empty">No saved photos yet.</div>';
    return;
  }

  const html = await Promise.all(favoritePosts.map(async post => {
    const url = await getImageUrl(post.storage_path);
    return `<div class="panel">
      ${url ? `<img class="post-image" src="${escapeHTML(url)}" alt="Favourite photo" loading="lazy">` : '<div class="empty">Image unavailable</div>'}
      <p>${escapeHTML(post.caption || '')}</p>
      <button class="btn secondary" data-action="favorite" data-id="${escapeHTML(post.id)}">Remove favourite</button>
    </div>`;
  }));

  $('favoritesList').innerHTML = html.join('');
}

async function loadComments(postId) {
  const area = $('comments-'+postId);
  if (!area) return;
  const list = area.querySelector('.comments-list');
  list.textContent = 'Loading comments...';

  const {data,error} = await db.from('photo_comments')
    .select('id,user_id,content,created_at')
    .eq('post_id',postId)
    .order('created_at',{ascending:true})
    .limit(100);

  if (error) {
    list.textContent = 'Could not load comments: '+errorMessage(error);
    return;
  }

  if (!data?.length) {
    list.innerHTML = '<p class="small muted">No comments yet.</p>';
    return;
  }

  const ids = [...new Set(data.map(row => row.user_id))];
  const {data:people} = await db.from('profiles')
    .select('user_id,display_name')
    .in('user_id',ids);

  const names = {};
  (people || []).forEach(person => names[person.user_id] = person.display_name);

  list.innerHTML = data.map(comment => `
    <div class="comment">
      <strong>${escapeHTML(names[comment.user_id] || 'User')}</strong>
      <span>${escapeHTML(comment.content)}</span>
      <div class="small muted">${escapeHTML(comment.created_at ? new Date(comment.created_at).toLocaleString() : '')}</div>
    </div>`).join('');
}

async function toggleLike(postId) {
  const existing = myLikes.has(postId);

  if (existing) {
    const {error} = await db.from('photo_likes').delete()
      .eq('post_id',postId).eq('user_id',currentUser.id);
    if (error) throw error;
  } else {
    const {error} = await db.from('photo_likes').insert({
      post_id:postId,user_id:currentUser.id
    });
    if (error) throw error;
  }
  await loadFeed();
}

async function toggleFavorite(postId) {
  const existing = myFavorites.has(postId);

  if (existing) {
    const {error} = await db.from('photo_favorites').delete()
      .eq('post_id',postId).eq('user_id',currentUser.id);
    if (error) throw error;
  } else {
    const {error} = await db.from('photo_favorites').insert({
      post_id:postId,user_id:currentUser.id
    });
    if (error) throw error;
  }

  await loadFeed();
  if (activeView === 'favorites') await renderFavorites();
}

async function deletePost(postId) {
  if (!isAdmin) throw new Error('Only the admin can delete posts.');
  const post = posts.find(item => item.id === postId);
  if (!post) throw new Error('Post not found.');

  if (!confirm('Are you sure you want to delete this photo permanently?')) return;

  const {error:deleteError} = await db.from('photo_posts')
    .delete().eq('id',postId);

  if (deleteError) throw deleteError;

  const {error:storageError} = await db.storage.from(BUCKET).remove([post.storage_path]);

  if (storageError) {
    showStatus('globalStatus','Post deleted, but its storage file could not be removed: '+errorMessage(storageError),'error');
  } else {
    showStatus('globalStatus','Photo deleted successfully.','success');
  }

  await loadFeed();
}

async function loadNotifications() {
  if (!currentUser) return;
  $('notificationsList').innerHTML = '<div class="empty">Loading...</div>';

  const {data,error} = await db.from('notifications')
    .select('id,message,notification_type,is_read,created_at')
    .eq('user_id',currentUser.id)
    .order('created_at',{ascending:false})
    .limit(50);

  if (error) {
    $('notificationsList').innerHTML = '';
    showStatus('globalStatus','Notifications could not load: '+errorMessage(error),'error');
    return;
  }

  if (!data?.length) {
    $('notificationsList').innerHTML = '<div class="panel empty">No notifications yet.</div>';
    return;
  }

  $('notificationsList').innerHTML = data.map(item => `
    <div class="panel">
      <div class="row">
        <strong>${escapeHTML(item.notification_type || 'Notification')}</strong>
        ${item.is_read ? '<span class="small muted">Read</span>' : '<span class="small" style="color:var(--pink)">New</span>'}
      </div>
      <p>${escapeHTML(item.message || '')}</p>
      <div class="small muted">${escapeHTML(item.created_at ? new Date(item.created_at).toLocaleString() : '')}</div>
      ${!item.is_read ? `<button class="btn secondary" data-action="read-notification" data-id="${escapeHTML(item.id)}">Mark as read</button>` : ''}
    </div>`).join('');
}

async function submitUpload(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const file = $('photoFile').files[0];
  const caption = $('photoCaption').value.trim();

  if (!file) return showStatus('uploadStatus','Please choose a photo.','error');
  if (!file.type.startsWith('image/')) return showStatus('uploadStatus','Only image files are allowed.','error');
  if (file.size > MAX_IMAGE_SIZE) return showStatus('uploadStatus','Image must be smaller than 10 MB.','error');

  setBusy(form,true,'Uploading...');
  hideStatus('uploadStatus');

  const extension = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const storagePath = `${currentUser.id}_${Date.now()}_${crypto.randomUUID().slice(0,8)}.${extension}`;

  try {
    const {error:uploadError} = await db.storage.from(BUCKET).upload(storagePath,file,{
      contentType:file.type,
      upsert:false
    });
    if (uploadError) throw uploadError;

    const {error:insertError} = await db.from('photo_posts').insert({
      user_id:currentUser.id,
      storage_path:storagePath,
      caption
    });

    if (insertError) {
      const cleanup = await db.storage.from(BUCKET).remove([storagePath]);
      if (cleanup.error) console.warn('Upload cleanup failed:',cleanup.error.message);
      throw insertError;
    }

    form.reset();
    showStatus('uploadStatus','Photo uploaded successfully! ❤️','success');
    logActivity('photo_upload','Uploaded a photo');
    await loadFeed();
    showView('feed');
  } catch (error) {
    showStatus('uploadStatus','Upload failed: '+errorMessage(error),'error');
  } finally {
    setBusy(form,false);
  }
}

async function saveProfile(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const displayName = $('profileName').value.trim();
  const username = $('profileUsername').value.trim();
  const bio = $('profileBio').value.trim();
  const website = $('profileWebsite').value.trim();

  if (!displayName) return showStatus('profileStatus','Display name is required.','error');
  if (username && !/^[a-zA-Z0-9_]{3,24}$/.test(username)) {
    return showStatus('profileStatus','Username must be 3–24 characters and contain only letters, numbers or underscores.','error');
  }

  setBusy(form,true,'Saving...');
  hideStatus('profileStatus');

  try {
    const updates = {
      user_id:currentUser.id,
      display_name:displayName,
      username:username || null,
      bio,
      website:website || null,
      is_private:$('profilePrivate').checked,
      updated_at:new Date().toISOString()
    };

    const {data,error} = await db.from('profiles')
      .upsert(updates,{onConflict:'user_id'})
      .select()
      .single();

    if (error) throw error;

    profiles[currentUser.id] = data;
    showStatus('profileStatus','Profile saved successfully.','success');
    logActivity('profile_update','Updated profile');
    await loadFeed();
  } catch (error) {
    showStatus('profileStatus','Could not save profile: '+errorMessage(error),'error');
  } finally {
    setBusy(form,false);
  }
}

async function sendComment(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const postId = form.dataset.post;
  const input = form.querySelector('input[name="content"]');
  const content = input.value.trim();
  if (!content) return;

  const button = form.querySelector('button');
  button.disabled = true;

  try {
    const {error} = await db.from('photo_comments').insert({
      post_id:postId,
      user_id:currentUser.id,
      content
    });
    if (error) throw error;

    input.value = '';
    await loadComments(postId);
    logActivity('comment','Added a comment');
  } catch (error) {
    alert('Comment failed: '+errorMessage(error));
  } finally {
    button.disabled = false;
  }
}

async function handleClick(event) {
  const navButton = event.target.closest('[data-view]');
  if (navButton) {
    showView(navButton.dataset.view);
    return;
  }

  const actionButton = event.target.closest('[data-action]');
  if (!actionButton) return;

  const action = actionButton.dataset.action;
  const id = actionButton.dataset.id;
  actionButton.disabled = true;

  try {
    if (action === 'like') await toggleLike(id);
    if (action === 'favorite') await toggleFavorite(id);
    if (action === 'delete-post') await deletePost(id);

    if (action === 'toggle-comments') {
      const area = $('comments-'+id);
      if (area) {
        area.classList.toggle('hidden');
        if (!area.classList.contains('hidden')) await loadComments(id);
      }
    }

    if (action === 'read-notification') {
      const {error} = await db.from('notifications')
        .update({is_read:true})
        .eq('id',id)
        .eq('user_id',currentUser.id);
      if (error) throw error;
      await loadNotifications();
    }
  } catch (error) {
    showStatus('globalStatus',errorMessage(error),'error');
  } finally {
    actionButton.disabled = false;
  }
}

async function handleLogin(event) {
  event.preventDefault();
  const form = event.currentTarget;
  setBusy(form,true,'Logging in...');
  hideStatus('authStatus');

  try {
    const {data,error} = await db.auth.signInWithPassword({
      email:$('loginEmail').value.trim(),
      password:$('loginPassword').value
    });
    if (error) throw error;
    if (data.user) await enterApp(data.user);
  } catch (error) {
    showStatus('authStatus','Login failed: '+errorMessage(error),'error');
  } finally {
    setBusy(form,false);
  }
}

async function handleSignup(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const name = $('signupName').value.trim();
  const email = $('signupEmail').value.trim();
  const password = $('signupPassword').value;

  if (!name) return showStatus('authStatus','Please enter your name.','error');
  if (password.length < 6) return showStatus('authStatus','Password must be at least 6 characters.','error');

  setBusy(form,true,'Creating account...');
  hideStatus('authStatus');

  try {
    const {data,error} = await db.auth.signUp({
      email,
      password,
      options:{data:{display_name:name}}
    });
    if (error) throw error;

    if (data.session && data.user) {
      await enterApp(data.user);
    } else {
      showStatus('authStatus','Account created. Check your email for the confirmation link, then log in.','success');
    }
  } catch (error) {
    showStatus('authStatus','Signup failed: '+errorMessage(error),'error');
  } finally {
    setBusy(form,false);
  }
}

async function forgotPassword() {
  const email = $('loginEmail').value.trim();
  if (!email) {
    showStatus('authStatus','Enter your email in the Login email field first.','error');
    return;
  }

  try {
    const redirectTo = window.location.origin + window.location.pathname;
    const {error} = await db.auth.resetPasswordForEmail(email,{redirectTo});
    if (error) throw error;
    showStatus('authStatus','Password reset link sent. Check your email inbox.','success');
  } catch (error) {
    showStatus('authStatus','Could not send reset email: '+errorMessage(error),'error');
  }
}

async function updatePassword(event) {
  event.preventDefault();
  const password = $('newPassword').value;
  const confirmPassword = $('confirmPassword').value;

  if (password.length < 6) return showStatus('resetStatus','Password must be at least 6 characters.','error');
  if (password !== confirmPassword) return showStatus('resetStatus','Passwords do not match.','error');

  const form = event.currentTarget;
  setBusy(form,true,'Updating...');

  try {
    const {error} = await db.auth.updateUser({password});
    if (error) throw error;
    showStatus('resetStatus','Password updated successfully. You can now continue.','success');
    $('resetForm').reset();
    if (currentUser) await enterApp(currentUser);
  } catch (error) {
    showStatus('resetStatus','Could not update password: '+errorMessage(error),'error');
  } finally {
    setBusy(form,false);
  }
}

async function logout() {
  const {error} = await db.auth.signOut();
  if (error) {
    showStatus('globalStatus','Logout failed: '+errorMessage(error),'error');
    return;
  }
  currentUser = null;
  isAdmin = false;
  posts = [];
  setScreen('authScreen');
}

$('loginForm').addEventListener('submit',handleLogin);
$('signupForm').addEventListener('submit',handleSignup);
$('forgotBtn').addEventListener('click',forgotPassword);
$('resetForm').addEventListener('submit',updatePassword);
$('uploadForm').addEventListener('submit',submitUpload);
$('profileForm').addEventListener('submit',saveProfile);
$('logoutBtn').addEventListener('click',logout);
$('refreshBtn').addEventListener('click',loadFeed);
$('refreshNotifications').addEventListener('click',loadNotifications);
document.addEventListener('click',handleClick);
document.addEventListener('submit',event => {
  if (event.target.matches('.comment-form')) sendComment(event);
});

db.auth.onAuthStateChange((event,session) => {
  if (event === 'PASSWORD_RECOVERY') {
    setScreen('resetScreen');
    return;
  }
  if (session?.user) {
    void enterApp(session.user);
  } else if (event === 'SIGNED_OUT') {
    currentUser = null;
    setScreen('authScreen');
  }
});

(async function init() {
  try {
    const {data,error} = await db.auth.getSession();
    if (error) throw error;

    const isRecovery = window.location.hash.includes('type=recovery');
    if (isRecovery) {
      setScreen('resetScreen');
      return;
    }

    if (data.session?.user) {
      await enterApp(data.session.user);
    } else {
      setScreen('authScreen');
    }
  } catch (error) {
    setScreen('authScreen');
    showStatus('authStatus','Could not connect: '+errorMessage(error),'error');
  }
})();

})();
</script>
</body>
</html>
