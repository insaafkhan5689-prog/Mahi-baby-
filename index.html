
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09070f">
<title>Mahi Baby ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#09070f;
  --panel:#171220;
  --line:#30243f;
  --text:#fff7ff;
  --muted:#aa9bb8;
  --pink:#ff4fa3;
  --purple:#9865ff;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial, sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{
  height:65px;padding:0 18px;display:flex;
  align-items:center;justify-content:space-between;
  background:#110d19;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;
}
.brand{font-size:21px;font-weight:900}
.brand span{color:var(--pink)}
.layout{
  max-width:1200px;margin:22px auto;padding:0 16px;
  display:grid;grid-template-columns:210px 1fr;gap:22px;
}
.sidebar{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:12px;height:max-content;
  position:sticky;top:85px;
}
.navbtn{
  display:block;width:100%;text-align:left;padding:13px;
  margin:3px 0;border:0;border-radius:11px;
  background:transparent;color:var(--muted);font-weight:bold;
}
.navbtn.active,.navbtn:hover{
  color:white;background:linear-gradient(90deg,#55204d,#302044);
}
.main{min-width:0}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:17px;margin-bottom:15px;
}
h1{font-size:26px;margin:0 0 16px}
.muted{color:var(--muted)}
.btn{
  border:0;border-radius:11px;padding:11px 16px;
  background:linear-gradient(100deg,var(--pink),var(--purple));
  color:white;font-weight:bold;
}
.secondary{background:#292034;border:1px solid var(--line)}
.danger{background:#641c35}
.field{
  width:100%;padding:12px;margin:7px 0 14px;
  color:white;background:#0d0a13;
  border:1px solid var(--line);border-radius:10px;
}
label{font-size:13px;font-weight:bold}
.auth{
  max-width:430px;margin:8vh auto;padding:18px;
}
.auth .card{padding:25px}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
}
.stat{
  background:#20172b;border:1px solid var(--line);
  border-radius:14px;padding:15px;
}
.stat strong{display:block;font-size:24px}
.feed{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.post{padding:0;overflow:hidden}
.post img{
  width:100%;max-height:480px;object-fit:cover;
  display:block;background:#09070f;
}
.postbody{padding:13px}
.person{display:flex;align-items:center;gap:10px}
.avatar{
  width:42px;height:42px;border-radius:50%;
  object-fit:cover;background:#392744;
}
.avatar.big{width:85px;height:85px}
.notice{
  padding:11px;border-radius:10px;margin:10px 0;
  background:#281a35;border:1px solid var(--line);
}
.error{background:#351724;color:#ffd9e2}
.success{background:#123328;color:#caffea}
.empty{text-align:center;padding:35px;color:var(--muted)}
.mobile-nav{display:none}
.preview{
  width:100%;max-height:330px;object-fit:contain;
  background:#08060c;border-radius:12px;margin:10px 0;
}
@media(max-width:750px){
  .layout{display:block;padding:0 12px 85px}
  .sidebar{display:none}
  .feed{grid-template-columns:1fr}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    justify-content:space-around;background:#110d19;
    border-top:1px solid var(--line);
    padding:8px 3px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .mobile-nav button{
    background:none;border:0;color:var(--muted);
    font-size:11px;padding:5px;
  }
  .mobile-nav button.active{color:var(--pink)}
  .stats{gap:7px}
  .stat{padding:10px}
  .stat strong{font-size:19px}
}
</style>
</head>
<body>

<div id="authScreen" class="auth">
  <div class="card">
    <div class="brand">MAHI <span>BABY ❤️</span></div>
    <h1 id="authTitle">Welcome Back</h1>
    <p class="muted">Your personal photo community.</p>
    <div id="authMessage"></div>

    <form id="authForm">
      <label>Email</label>
      <input class="field" id="email" type="email" required>

      <label>Password</label>
      <input class="field" id="password" type="password"
       minlength="6" required>

      <div id="signupFields" class="hidden">
        <label>Your Name</label>
        <input class="field" id="signupName" maxlength="40">
      </div>

      <button class="btn" id="authSubmit" type="submit"
       style="width:100%">Sign In</button>
    </form>

    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn secondary" id="toggleAuth" type="button">
        Create Account
      </button>
      <button class="btn secondary" id="forgotBtn" type="button">
        Forgot Password
      </button>
    </div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="brand">MAHI <span>BABY ❤️</span></div>
    <div>
      <button class="btn secondary" id="uploadTop">＋ Upload</button>
      <button class="btn secondary" id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="desktopNav"></aside>
    <main class="main" id="mainContent"></main>
  </div>

  <nav class="mobile-nav" id="mobileNav"></nav>
</div>

<script>
const SUPABASE_URL = "https://jhvmqedhxkahjroyquty.supabase.co";
const SUPABASE_KEY = "sb_publishable_ItB77qS23ODZE5xlTCs5Xw_7AFljOyX";
const BUCKET = "mahi-photos";
const ADMIN_UID = "6b19250a-ab16-4e98-bae6-2f6473d8a4cb";

const db = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let user = null;
let profile = null;
let isAdmin = false;
let currentPage = "dashboard";
let signupMode = false;
let searchText = "";

const pages = [
  ["dashboard","⌂","Dashboard"],
  ["myphotos","▧","My Photos"],
  ["upload","＋","Upload"],
  ["activity","◷","Activity"],
  ["community","◎","Community"],
  ["profile","◉","My Profile"],
  ["settings","⚙","Settings"]
];

function escapeHTML(value=""){
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function message(id,text,type=""){
  $(id).innerHTML = text
    ? `<div class="notice ${type}">${escapeHTML(text)}</div>`
    : "";
}

function authMode(signup){
  signupMode = signup;
  $("authTitle").textContent = signup ? "Create Account" : "Welcome Back";
  $("authSubmit").textContent = signup ? "Create Account" : "Sign In";
  $("toggleAuth").textContent = signup
    ? "Already have an account?" : "Create Account";
  $("signupFields").classList.toggle("hidden",!signup);
  $("signupName").required = signup;
  message("authMessage","");
}
</script>
</body>
</html>
