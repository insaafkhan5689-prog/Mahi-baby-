
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f5f0">
<title>MAHI BABY — Social Club</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f8f5f0;
  --paper:#fffefa;
  --ink:#29232a;
  --muted:#89818a;
  --line:#eee7e8;
  --plum:#592e4e;
  --rose:#d88b9d;
  --rose-light:#f5e3e7;
  --gold:#b18a58;
  --shadow:0 12px 35px rgba(57,34,48,.07);
  --radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'DM Sans',sans-serif;
  padding-bottom:90px;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
img{max-width:100%;display:block}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.serif{font-family:'Playfair Display',serif}
#app{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(248,245,240,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(238,231,232,.8);
}
.topbar-inner{
  max-width:1120px;margin:auto;padding:15px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:38px;height:38px;border-radius:14px;
  display:grid;place-items:center;background:var(--plum);
  color:white;font-family:'Playfair Display',serif;font-size:21px;
}
.brand-name{font-family:'Playfair Display',serif;font-size:22px;letter-spacing:.4px}
.brand-sub{font-size:9px;letter-spacing:2.5px;color:var(--muted);margin-top:1px}
.top-actions{display:flex;gap:9px;align-items:center}
.icon-btn{
  width:40px;height:40px;border:1px solid var(--line);
  border-radius:50%;background:var(--paper);color:var(--ink);
  display:grid;place-items:center;font-size:17px;
}
.avatar{
  width:38px;height:38px;border-radius:50%;object-fit:cover;
  background:var(--rose-light);display:grid;place-items:center;
  color:var(--plum);font-weight:800;overflow:hidden;flex-shrink:0;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.page{
  max-width:1120px;margin:0 auto;padding:24px 20px 40px;
}
.layout{display:grid;grid-template-columns:minmax(0,680px) 290px;gap:30px}
.section-heading{
  display:flex;align-items:end;justify-content:space-between;
  margin:5px 0 20px;
}
.section-heading h1,.section-heading h2{
  font-family:'Playfair Display',serif;font-weight:600;margin:0;
}
.section-heading h1{font-size:34px}
.section-heading h2{font-size:26px}
.eyebrow{
  text-transform:uppercase;letter-spacing:2px;
  font-size:10px;font-weight:800;color:var(--rose);
}
.card{
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
}
.stories{
  display:flex;gap:17px;overflow-x:auto;padding:17px 16px;
  margin-bottom:20px;scrollbar-width:none;
}
.stories::-webkit-scrollbar{display:none}
.story{min-width:65px;text-align:center}
.story-ring{
  width:62px;height:62px;padding:3px;border-radius:50%;
  background:linear-gradient(135deg,#d88b9d,#b18a58,#592e4e);
  margin:0 auto 7px;
}
.story-ring .avatar{width:100%;height:100%;border:2px solid var(--paper)}
.story-name{font-size:11px;color:var(--muted);white-space:nowrap}
.post-card{margin-bottom:22px;overflow:hidden}
.post-head{
  display:flex;align-items:center;gap:11px;padding:15px 17px;
}
.post-user{flex:1;min-width:0}
.post-user strong{font-size:13px}
.post-user small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.post-menu{border:0;background:none;font-size:22px;color:var(--muted)}
.post-media{
  width:100%;max-height:690px;object-fit:cover;
  background:#eee;aspect-ratio:4/4.5;
}
.post-video{width:100%;max-height:690px;background:#161216}
.post-content{padding:14px 17px 17px}
.post-actions{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.action-btn{
  border:0;background:none;padding:0;color:var(--ink);
  display:flex;align-items:center;gap:6px;font-size:14px;
}
.action-btn .symbol{font-size:22px}
.action-btn.liked{color:#d45c78}
.action-btn.saved{color:var(--plum)}
.post-caption{font-size:13px;line-height:1.65;white-space:pre-wrap}
.post-caption strong{margin-right:5px}
.post-date{font-size:10px;color:var(--muted);margin-top:10px}
.side-card{padding:20px;margin-bottom:17px}
.side-card h3{font-family:'Playfair Display',serif;margin:0 0 12px;font-size:19px}
.side-note{font-size:12px;line-height:1.7;color:var(--muted)}
.side-profile{display:flex;gap:10px;align-items:center;margin:13px 0}
.side-profile-info{flex:1;font-size:12px}
.primary-btn{
  border:0;border-radius:13px;padding:12px 17px;
  color:white;background:var(--plum);font-weight:700;
}
.primary-btn:hover{filter:brightness(1.12)}
.secondary-btn{
  border:1px solid var(--line);background:var(--paper);
  border-radius:13px;padding:11px 15px;color:var(--ink);font-weight:700;
}
.text-btn{border:0;background:none;color:var(--plum);font-weight:800}
.full{width:100%}
.form-control{
  width:100%;border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;background:#fff;color:var(--ink);
  outline:none;margin:6px 0 13px;
}
.form-control:focus{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-light)}
textarea.form-control{resize:vertical;min-height:95px}
.field-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.7px}
.empty-state{
  padding:45px 20px;text-align:center;color:var(--muted);
}
.empty-icon{font-size:35px;margin-bottom:10px}
.empty-state h3{font-family:'Playfair Display',serif;color:var(--ink);font-size:22px;margin:5px}
.search-box{position:relative;margin-bottom:18px}
.search-box input{padding-left:42px}
.search-symbol{position:absolute;left:15px;top:17px;color:var(--muted)}
.result-row{
  display:flex;align-items:center;gap:12px;padding:13px;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.result-row:last-child{border-bottom:0}
.result-info{flex:1}
.result-info strong{font-size:13px}
.result-info small{display:block;color:var(--muted);margin-top:3px}
.profile-hero{padding:25px;margin-bottom:20px}
.profile-top{display:flex;gap:18px;align-items:center}
.profile-big{width:92px;height:92px;font-size:28px}
.profile-stats{display:flex;gap:24px;margin-top:17px}
.profile-stat{text-align:center}
.profile-stat strong{display:block;font-size:17px}
.profile-stat span{font-size:10px;color:var(--muted)}
.profile-bio{font-size:13px;line-height:1.7;margin-top:17px}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.profile-tile{aspect-ratio:1;overflow:hidden;background:#eee;cursor:pointer}
.profile-tile img,.profile-tile video{width:100%;height:100%;object-fit:cover}
.auth-wrap{max-width:430px;margin:45px auto;padding:30px}
.auth-title{text-align:center;margin-bottom:25px}
.auth-title h1{font-family:'Playfair Display',serif;font-size:34px;margin:8px 0}
.auth-switch{text-align:center;font-size:12px;margin-top:18px}
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(255,254,250,.96);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));
}
.nav-inner{
  max-width:680px;margin:auto;display:flex;justify-content:space-around;
}
.nav-item{
  border:0;background:none;color:#a49ba3;min-width:54px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:700;padding:4px 8px;
}
.nav-item .nav-icon{font-size:21px;line-height:24px}
.nav-item.active{color:var(--plum)}
.nav-create .nav-icon{
  width:42px;height:32px;border-radius:12px;background:var(--plum);
  color:white;display:grid;place-items:center;font-size:23px;
}
.modal-backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(31,20,29,.45);
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal{
  background:var(--paper);border-radius:24px;padding:22px;
  width:min(100%,480px);max-height:88vh;overflow:auto;
  box-shadow:0 20px 80px rgba(0,0,0,.2);
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modal-head h2{font-family:'Playfair Display',serif;margin:0;font-size:24px}
.close-btn{border:0;background:none;font-size:24px;color:var(--muted)}
.preview{
  width:100%;max-height:300px;object-fit:contain;border-radius:14px;
  background:#f0ecec;margin:10px 0;
}
.chat-list{overflow:hidden}
.chat-row{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line);cursor:pointer}
.chat-row:last-child{border:0}
.chat-row-info{flex:1;min-width:0}
.chat-row-info strong{font-size:13px}
.chat-row-info small{display:block;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-window{display:flex;flex-direction:column;height:65vh;min-height:390px}
.chat-messages{flex:1;overflow-y:auto;padding:12px 0}
.bubble{max-width:78%;padding:11px 14px;border-radius:17px;margin:7px 0;font-size:13px;line-height:1.5;white-space:pre-wrap}
.bubble.mine{margin-left:auto;background:var(--plum);color:white;border-bottom-right-radius:5px}
.bubble.theirs{background:#f0e9ec;color:var(--ink);border-bottom-left-radius:5px}
.chat-compose{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.chat-compose input{flex:1;margin:0}
.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
  z-index:100;background:#302531;color:white;padding:12px 18px;
  border-radius:13px;font-size:12px;box-shadow:var(--shadow);
  max-width:90%;text-align:center;
}
.loading{padding:35px;text-align:center;color:var(--muted)}
.divider{height:1px;background:var(--line);margin:15px 0}
@media(max-width:800px){
  .layout{display:block}
  .desktop-side{display:none}
  .page{padding:18px 12px 30px}
  .topbar-inner{padding:12px 15px}
  .brand-name{font-size:20px}
  .section-heading h1{font-size:29px}
  .post-card{border-radius:18px}
}
@media(min-width:801px){
  body{padding-bottom:0}
  .bottom-nav{position:fixed;top:50%;bottom:auto;left:22px;right:auto;
    width:66px;transform:translateY(-50%);border:1px solid var(--line);
    border-radius:22px;padding:12px 5px}
  .nav-inner{flex-direction:column;gap:12px}
  .nav-item{padding:9px 2px}
  .page{padding-left:95px}
}
</style>
</head>

<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <div class="brand-name">MAHI BABY</div>
          <div class="brand-sub">YOUR SOCIAL CLUB</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" onclick="go('explore')" aria-label="Search">⌕</button>
        <button class="icon-btn" onclick="go('messages')" aria-label="Messages">✉</button>
        <div id="topAvatar" class="avatar" onclick="go('profile')">M</div>
      </div>
    </div>
  </header>

  <main class="page">
    <div id="pageContent">
      <div class="loading">Opening your social club…</div>
    </div>
  </main>

  <nav class="bottom-nav">
    <div class="nav-inner">
      <button class="nav-item active" data-nav="home" onclick="go('home')">
        <span class="nav-icon">⌂</span><span>Home</span>
      </button>
      <button class="nav-item" data-nav="explore" onclick="go('explore')">
        <span class="nav-icon">⌕</span><span>Explore</span>
      </button>
      <button class="nav-item nav-create" data-nav="create" onclick="go('create')">
        <span class="nav-icon">＋</span><span>Create</span>
      </button>
      <button class="nav-item" data-nav="messages" onclick="go('messages')">
        <span class="nav-icon">✉</span><span>Messages</span>
      </button>
      <button class="nav-item" data-nav="profile" onclick="go('profile')">
        <span class="nav-icon">◉</span><span>Profile</span>
      </button>
    </div>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =========================
   MAHI BABY CONFIGURATION
========================= */
const SUPABASE_URL = "https://jhvmqedhxkahjroyquty.supabase.co";
const SUPABASE_KEY = "sb_publishable_ItB77qS23ODZE5xlTCs5Xw_7AFljOyX";
const BUCKET = "Mahi baby";
const supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let db = supabaseClient;
let currentUser = null;
let currentProfile = null;
let isAdmin = false;
let currentPage = "home";
let feedPosts = [];
let profileMap = {};
let currentChatId = null;
let currentChatName = "";
let chatRefreshChannel = null;
let selectedUploadFile = null;
let activeCommentPost = null;
let currentChatMessages = [];
let searchTimer = null;

/* =========================
   HELPERS
========================= */
const $ = id => document.getElementById(id);

function esc(value=""){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function toast(message){
  $("toastRoot").innerHTML=`<div class="toast">${esc(message)}</div>`;
  setTimeout(()=>{$("toastRoot").innerHTML="";},2800);
}
function initials(name="M"){
  return esc(name.trim().charAt(0).toUpperCase()||"M");
}
function avatarHTML(profile,size=""){
  const name=profile?.display_name||profile?.username||"Member";
  const url=profile?.avatar_url||null;
  return `<div class="avatar ${size}">${url?`<img src="${esc(url)}" alt="">`:initials(name)}</div>`;
}
function timeAgo(date){
  const seconds=Math.max(0,Math.floor((Date.now()-new Date(date).getTime())/1000));
  if(seconds<60)return "Just now";
  if(seconds<3600)return Math.floor(seconds/60)+"m ago";
  if(seconds<86400)return Math.floor(seconds/3600)+"h ago";
  if(seconds<604800)return Math.floor(seconds/86400)+"d ago";
  return new Date(date).toLocaleDateString();
}
function fileExtension(name=""){
  const part=name.split(".").pop().toLowerCase();
  return /^[a-z0-9]{1,8}$/.test(part)?part:"jpg";
}
function randomName(file){
  return `${currentUser.id}/${Date.now()}_${crypto.randomUUID()}.${fileExtension(file.name)}`;
}
function mediaType(file){
  if(file.type.startsWith("video/"))return "video";
  if(file.type==="image/gif"||file.name.toLowerCase().endsWith(".gif"))return "gif";
  return "image";
}
async function signedMedia(path){
  if(!path)return null;
  const {data,error}=await db.storage.from(BUCKET).createSignedUrl(path,3600);
  if(error){console.error(error);return null;}
  return data?.signedUrl||null;
}
function mediaHTML(url,type){
  if(!url)return `<div class="empty-state">Media unavailable</div>`;
  if(type==="video")return `<video class="post-video" src="${esc(url)}" controls playsinline preload="metadata"></video>`;
  return `<img class="post-media" src="${esc(url)}" alt="Post image" loading="lazy">`;
}
function requireLogin(){
  if(!currentUser){showAuth();return false;}
  return true;
}
function setActiveNav(page){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.classList.toggle("active",el.dataset.nav===page);
  });
}
function showModal(html){
  $("modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){$("modalRoot").innerHTML="";}
function go(page){
  currentPage=page;
  setActiveNav(page);
  if(page==="home")loadFeed();
  else if(page==="explore")renderExplore();
  else if(page==="create")renderCreate();
  else if(page==="messages")loadConversations();
  else if(page==="profile")loadProfilePage(currentUser?.id);
}

/* =========================
   AUTHENTICATION
========================= */
async function init(){
  const {data,error}=await db.auth.getSession();
  if(error)console.error(error);
  currentUser=data?.session?.user||null;
  await refreshUserData();
  db.auth.onAuthStateChange(async(event,session)=>{
    currentUser=session?.user||null;
    await refreshUserData();
    if(currentPage==="home")loadFeed();
    else if(currentPage==="profile")loadProfilePage(currentUser?.id);
    else if(currentPage==="messages")loadConversations();
  });
  await loadFeed();
}
async function refreshUserData(){
  currentProfile=null;
  isAdmin=false;
  if(!currentUser){
    $("topAvatar").textContent="M";
    return;
  }
  const {data,error}=await db.from("profiles").select("*").eq("user_id",currentUser.id).maybeSingle();
  if(error)console.error("Profile:",error);
  currentProfile=data||null;
  if(!currentProfile){
    const fallback={
      user_id:currentUser.id,
      display_name:currentUser.user_metadata?.display_name||"New Member",
      username:(currentUser.email||"member").split("@")[0].replace(/[^a-z0-9_]/gi,"").toLowerCase().slice(0,20)+"_"+currentUser.id.slice(0,4)
    };
    const result=await db.from("profiles").upsert(fallback,{onConflict:"user_id"}).select().maybeSingle();
    if(!result.error)currentProfile=result.data;
    else console.warn("Profile creation:",result.error);
  }
  const {data:adminRow,error:adminError}=await db.from("admins").select("user_id").eq("user_id",currentUser.id).maybeSingle();
  if(adminError)console.warn("Admin lookup:",adminError);
  isAdmin=!!adminRow;
  const avatar=currentProfile?.avatar_url;
  if(avatar)$("topAvatar").innerHTML=`<img src="${esc(avatar)}" alt="">`;
  else $("topAvatar").textContent=initials(currentProfile?.display_name||"M");
}
function showAuth(mode="login"){
  const signup=mode==="signup";
  showModal(`
    <div class="auth-title">
      <div class="eyebrow">WELCOME TO YOUR SOCIAL CLUB</div>
      <h1>${signup?"Join the club":"Welcome back"}</h1>
      <p class="muted small">${signup?"Create your MAHI BABY account":"Sign in to continue"}</p>
    </div>
    <form onsubmit="handleAuth(event,'${signup?"signup":"login"}')">
      ${signup?`<label class="field-label">DISPLAY NAME</label><input class="form-control" id="authName" required maxlength="40" placeholder="Your name">`:""}
      <label class="field-label">EMAIL ADDRESS</label>
      <input class="form-control" id="authEmail" type="email" required placeholder="you@example.com">
      <label class="field-label">PASSWORD</label>
      <input class="form-control" id="authPassword" type="password" required minlength="6" placeholder="At least 6 characters">
      <button class="primary-btn full" type="submit">${signup?"Create account":"Sign in"}</button>
    </form>
    <div class="auth-switch">
      ${signup?`Already a member? <button class="text-btn" onclick="showAuth('login')">Sign in</button>`:`New here? <button class="text-btn" onclick="showAuth('signup')">Create account</button>`}
    </div>
    <div style="text-align:center;margin-top:15px"><button class="text-btn small" onclick="closeModal()">Continue browsing</button></div>
  `);
}
async function handleAuth(event,mode){
  event.preventDefault();
  const email=$("authEmail").value.trim();
  const password=$("authPassword").value;
  const button=event.submitter;
  button.disabled=true;
  button.textContent="Please wait…";
  try{
    if(mode==="signup"){
      const name=$("authName").value.trim();
      const {data,error}=await db.auth.signUp({
        email,password,options:{data:{display_name:name}}
      });
      if(error)throw error;
      if(!data.session){
        closeModal();
        toast("Account created. Check your email to confirm your account.");
      }else{
        closeModal();toast("Welcome to MAHI BABY!");
      }
    }else{
      const {error}=await db.auth.signInWithPassword({email,password});
      if(error)throw error;
      closeModal();toast("You're signed in.");
    }
  }catch(error){
    toast(error.message||"Authentication failed");
    button.disabled=false;
    button.textContent=mode==="signup"?"Create account":"Sign in";
  }
}
async function logout(){
  const {error}=await db.auth.signOut();
  if(error){toast(error.message);return;}
  currentUser=null;currentProfile=null;isAdmin=false;
  toast("Signed out");go("home");
}

/* =========================
   FEED
========================= */
async function loadFeed(){
  const root=$("pageContent");
  root.innerHTML=`
    <div class="section-heading">
      <div><div class="eyebrow">A LITTLE PLACE TO CONNECT</div><h1 class="serif">The Feed</h1></div>
      <span class="muted small">Your daily scroll ✦</span>
    </div>
    <div class="card stories" id="stories">
      <div class="story"><div class="story-ring"><div class="avatar">＋</div></div><div class="story-name">Your story</div></div>
      <div class="story"><div class="story-ring"><div class="avatar">M</div></div><div class="story-name">Mahi Baby</div></div>
    </div>
    <div class="layout">
      <section id="feedList"><div class="loading">Loading posts…</div></section>
      <aside class="desktop-side">
        <div class="card side-card">

async function fetchPosts(){
  const feed=$("feedList");
  if(!feed)return;
  const {data:posts,error}=await db.from("photo_posts").select("*").order("created_at",{ascending:false}).limit(50);
  if(error){
    console.error(error);
    feed.innerHTML=`<div class="card empty-state"><div class="empty-icon">♡</div><h3>Feed couldn't load</h3><p>${esc(error.message)}</p><button class="secondary-btn" onclick="fetchPosts()">Try again</button></div>`;
    return;
  }
  feedPosts=posts||[];
  if(!feedPosts.length){
    feed.innerHTML=`<div class="card empty-state"><div class="empty-icon">✧</div><h3>It's quiet in here</h3><p>Be the first to share a moment.</p>${currentUser?`<button class="primary-btn" onclick="go('create')">Create a post</button>`:`<button class="primary-btn" onclick="showAuth()">Join the club</button>`}</div>`;
    return;
  }
  const userIds=[...new Set(feedPosts.map(p=>p.user_id))];
  const {data:profiles}=await db.from("profiles").select("*").in("user_id",userIds);
  profileMap={};
  (profiles||[]).forEach(p=>profileMap[p.user_id]=p);
  let likes=[];
  if(currentUser){
    const {data}=await db.from("photo_likes").select("post_id").eq("user_id",currentUser.id).in("post_id",feedPosts.map(p=>p.id));
    likes=data||[];
  }
  const likedSet=new Set(likes.map(x=>x.post_id));
  const {data:allLikes}=await db.from("photo_likes").select("post_id").in("post_id",feedPosts.map(p=>p.id));
  const counts={};
  (allLikes||[]).forEach(x=>counts[x.post_id]=(counts[x.post_id]||0)+1);
  const {data:allComments}=await db.from("photo_comments").select("post_id").in("post_id",feedPosts.map(p=>p.id));
  const commentCounts={};
  (allComments||[]).forEach(x=>commentCounts[x.post_id]=(commentCounts[x.post_id]||0)+1);

  const rendered=await Promise.all(feedPosts.map(async post=>{
    const url=await signedMedia(post.storage_path);
    const profile=profileMap[post.user_id]||{};
    const name=profile.display_name||profile.username||"Member";
    const type=post.media_type||"image";
    const mine=currentUser?.id===post.user_id;
    return `
      <article class="card post-card" id="post-${post.id}">
        <div class="post-head">
          ${avatarHTML(profile)}
          <div class="post-user"><strong>${esc(name)}</strong><small>@${esc(profile.username||"member")} · ${timeAgo(post.created_at)}</small></div>
          <button class="post-menu" onclick="postMenu('${post.id}','${post.user_id}')" aria-label="Post options">···</button>
        </div>
        ${mediaHTML(url,type)}
        <div class="post-content">
          <div class="post-actions">
            <button class="action-btn ${likedSet.has(post.id)?"liked":""}" onclick="toggleLike('${post.id}')"><span class="symbol">${likedSet.has(post.id)?"♥":"♡"}</span><span>${counts[post.id]||0}</span></button>
            <button class="action-btn" onclick="openComments('${post.id}')"><span class="symbol">◯</span><span>${commentCounts[post.id]||0}</span></button>
            <button class="action-btn" onclick="startChat('${post.user_id}')"><span class="symbol">✉</span></button>
            <button class="action-btn" style="margin-left:auto" onclick="toggleSave('${post.id}')"><span class="symbol">♧</span></button>
          </div>
          ${post.caption?`<div class="post-caption"><strong>${esc(name)}</strong>${esc(post.caption)}</div>`:""}
          <div class="post-date">${new Date(post.created_at).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}</div>
        </div>
      </article>`;
  }));
  if($("feedList"))$("feedList").innerHTML=rendered.join("");
}
async function toggleLike(postId){
  if(!requireLogin())return;
  const {data:existing,error:findError}=await db.from("photo_likes").select("id").eq("post_id",postId).eq("user_id",currentUser.id).maybeSingle();
  if(findError){toast(findError.message);return;}
  let result;
  if(existing)result=await db.from("photo_likes").delete().eq("id",existing.id);
  else result=await db.from("photo_likes").insert({post_id:postId,user_id:currentUser.id});
  if(result.error){toast(result.error.message);return;}
  await fetchPosts();
}
async function toggleSave(postId){
  if(!requireLogin())return;
  const {data:existing,error}=await db.from("photo_saves").select("id").eq("post_id",postId).eq("user_id",currentUser.id).maybeSingle();
  if(error){toast(error.message);return;}
  const result=existing
    ?await db.from("photo_saves").delete().eq("id",existing.id)
    :await db.from("photo_saves").insert({post_id:postId,user_id:currentUser.id});
  if(result.error){toast(result.error.message);return;}
  toast(existing?"Removed from saved":"Post saved");
}
function postMenu(postId,ownerId){
  const adminOrOwner=isAdmin;
  showModal(`

    <button class="secondary-btn full" onclick="copyPostLink('${postId}')">Copy post ID</button>

async function copyPostLink(id){
  try{await navigator.clipboard.writeText(location.href.split("#")[0]+"#post-"+id);toast("Post link copied");}
  catch(e){toast("Copy unavailable on this browser");}
  closeModal();
}
async function adminDeletePost(postId){
  if(!isAdmin){toast("Admin access required");return;}
  if(!confirm("Delete this post? This cannot be undone."))return;
  const post=feedPosts.find(p=>p.id===postId);
  if(!post)return;
  const {error}=await db.from("photo_posts").delete().eq("id",postId);
  if(error){toast(error.message);return;}
  if(post.storage_path){
    const {error:storageError}=await db.storage.from(BUCKET).remove([post.storage_path]);
    if(storageError)console.warn("Storage cleanup:",storageError);
  }
  closeModal();toast("Post deleted");await fetchPosts();
}
function reportPost(postId){
  closeModal();
  if(!requireLogin())return;
  showModal(`<div class="modal-head"><h2>Report post</h2><button class="close-btn" onclick="closeModal()">×</button></div>
  <p class="side-note">Tell us why you are reporting this post. A report will be saved for review.</p>

  <button class="primary-btn full" onclick="submitReport('${postId}')">Submit report</button>`);

async function submitReport(postId){
  const reason=$("reportReason").value.trim();
  if(!reason){toast("Please enter a reason");return;}
  const {error}=await db.from("activity_logs").insert({user_id:currentUser.id,action:"report_post",details:`Post ${postId}: ${reason}`});
  if(error){toast(error.message);return;}
  closeModal();toast("Report submitted");
}

async function sendComment(postId){

  await openComments(postId);

async function adminDeleteComment(commentId,postId){

function renderCreate(){
  $("pageContent").innerHTML=`
    <div class="section-heading"><div><div class="eyebrow">SHARE A MOMENT</div><h1>Create</h1></div></div>
    ${!currentUser?`<div class="card empty-state"><div class="empty-icon">✧</div><h3>Join before you post</h3><p>Sign in to share photos and videos.</p><button class="primary-btn" onclick="showAuth()">Sign in / Join</button></div>`:`
    <div class="card" style="padding:20px">
      <div class="field-label">YOUR PHOTO OR VIDEO</div>
      <input class="form-control" type="file" id="postFile" accept="image/*,video/*" onchange="previewPostFile(event)">
      <div id="postPreview"></div>
      <div class="field-label">CAPTION</div>
      <textarea class="form-control" id="postCaption" maxlength="2200" placeholder="What's on your mind?"></textarea>
      <div class="small muted" style="margin-bottom:15px">Photos, GIFs and videos are supported. Maximum file size: 50 MB.</div>
      <button class="primary-btn full" id="publishBtn" onclick="createPost()">Share post</button>
    </div>`}`;
}
function previewPostFile(event){
  const file=event.target.files?.[0];
  selectedUploadFile=file||null;
  if(!file){$("postPreview").innerHTML="";return;}
  if(file.size>50*1024*1024){toast("File must be 50 MB or smaller");event.target.value="";selectedUploadFile=null;return;}
  const url=URL.createObjectURL(file);
  $("postPreview").innerHTML=file.type.startsWith("video/")
    ?`<video class="preview" src="${url}" controls></video>`
    :`<img class="preview" src="${url}" alt="Preview">`;
}
async function createPost(){
  if(!requireLogin())return;
  const file=$("postFile")?.files?.[0];
  const caption=$("postCaption")?.value.trim()||"";
  if(!file){toast("Please select a photo, video or GIF to post.");return;}
  if(file.size>50*1024*1024){toast("File must be 50 MB or smaller");return;}
  const button=$("publishBtn");
  button.disabled=true;button.textContent="Uploading…";
  const path=randomName(file);
  try{
    const {error:uploadError}=await db.storage.from(BUCKET).upload(path,file,{
      upsert:false,contentType:file.type||"application/octet-stream"
    });
    if(uploadError)throw uploadError;
    const {error:insertError}=await db.from("photo_posts").insert({
      user_id:currentUser.id,
      storage_path:path,
      caption,
      media_type:mediaType(file)
    });
    if(insertError){
      await db.storage.from(BUCKET).remove([path]);
      throw insertError;
    }
    selectedUploadFile=null;
    toast("Your post is live!");
    go("home");
  }catch(error){
    console.error(error);
    toast(error.message||"Upload failed");
    button.disabled=false;button.textContent="Share post";
  }
}

    if(term.length<2){
      root.innerHTML=`<div class="empty-state">Type at least 2 characters to search.</div>`;

async function editProfile(){

    <div class="modal-head"><h2>Edit your profile</h2><button class="close-btn" onclick="closeModal()">×</button></div>
    <label class="field-label">DISPLAY NAME</label><input class="form-control" id="editName" maxlength="40" value="${esc(currentProfile?.display_name||"")}">

    <button class="primary-btn full" onclick="saveProfile()">Save changes</button>`);

async function saveProfile(){
  const display_name=$("editName").value.trim();
  const username=$("editUsername").value.trim().toLowerCase().replace(/[^a-z0-9_.]/g,"");
  const bio=$("editBio").value.trim();
  const website=$("editWebsite").value.trim();
  if(!display_name||!username){toast("Name and username are required");return;}
  const updates={user_id:currentUser.id,display_name,username,bio,website,updated_at:new Date().toISOString()};
  const file=$("avatarFile").files?.[0];
  if(file){
    if(file.size>10*1024*1024){toast("Profile photo must be under 10 MB");return;}
    const path=`${currentUser.id}/avatar_${Date.now()}.${fileExtension(file.name)}`;
    const {error:uploadError}=await db.storage.from(BUCKET).upload(path,file,{upsert:true,contentType:file.type});
    if(uploadError){toast(uploadError.message);return;}
    updates.avatar_path=path;
  }
  const {error}=await db.from("profiles").upsert(updates,{onConflict:"user_id"});
  if(error){toast(error.message);return;}
  closeModal();await refreshUserData();await loadProfilePage(currentUser.id);toast("Profile updated");
}

  const html=await Promise.all((conversations||[]).map(async conv=>{
    const {data:participants}=await db.from("conversation_members").select("user_id").eq("conversation_id",conv.id);
    const other=(participants||[]).find(p=>p.user_id!==currentUser.id);
    let person=null;
    if(other){
      const {data}=await db.from("profiles").select("*").eq("user_id",other.user_id).maybeSingle();
      person=data;
    }
    const title=conv.title||person?.display_name||"Private chat";
    const last=await db.from("messages").select("content,created_at").eq("conversation_id",conv.id).order("created_at",{ascending:false}).limit(1).maybeSingle();
    return `<div class="chat-row" onclick="openChat('${conv.id}','${esc(title)}')">
      ${avatarHTML(person||{display_name:title})}
      <div class="chat-row-info"><strong>${esc(title)}</strong><small>${esc(last.data?.content||"Start a conversation")}</small></div>
      <span class="muted small">${last.data?.created_at?timeAgo(last.data.created_at):""}</span>
    </div>`;
  }));
  if($("conversationList"))$("conversationList").innerHTML=html.join("")||`<div class="empty-state">No conversations yet.</div>`;

  <div id="newChatResults"></div>`);
}
let chatSearchTimer=null;
async function searchChatUsers(query){
  clearTimeout(chatSearchTimer);
  chatSearchTimer=setTimeout(async()=>{
    const root=$("newChatResults");if(!root)return;
    const term=query.trim();
    if(term.length<2){root.innerHTML=`<p class="muted small">Type at least 2 characters.</p>`;return;}
    const {data,error}=await db.from("profiles").select("*").or(`username.ilike.%${term}%,display_name.ilike.%${term}%`).neq("user_id",currentUser.id).limit(15);
    if(error){root.innerHTML=`<p class="muted small">${esc(error.message)}</p>`;return;}
    root.innerHTML=data?.length?data.map(p=>`
      <div class="result-row" onclick="startChat('${p.user_id}')">
        ${avatarHTML(p)}<div class="result-info"><strong>${esc(p.display_name||"Member")}</strong><small>@${esc(p.username||"member")}</small></div><span>›</span>
      </div>`).join(""):`<div class="empty-state">No members found.</div>`;
  },300);
}
async function startChat(userId){
  if(!requireLogin())return;
  if(userId===currentUser.id){toast("You cannot message yourself");return;}
  const {data:chatId,error}=await db.rpc("create_direct_chat",{other_user_id:userId});
  if(error){toast(error.message);console.error(error);return;}
  closeModal();
  const {data:profile}=await db.from("profiles").select("*").eq("user_id",userId).maybeSingle();
  await openChat(chatId,profile?.display_name||"Private chat");
}
async function openChat(chatId,title){
  currentChatId=chatId;currentChatName=title;
  showModal(`<div class="modal-head"><div><div class="eyebrow">PRIVATE CHAT</div><h2>${esc(title)}</h2></div><button class="close-btn" onclick="closeChat()">×</button></div>
  <div class="chat-window">
    <div class="chat-messages" id="chatMessages"><div class="loading">Loading messages…</div></div>
    <div class="chat-compose"><input class="form-control" id="chatInput" placeholder="Write a message…" maxlength="4000" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"><button class="primary-btn" onclick="sendMessage()">Send</button></div>
  </div>`);
  await refreshChatMessages();
}
function closeChat(){
  currentChatId=null;closeModal();
}
async function refreshChatMessages(){
  if(!currentChatId)return;
  const {data,error}=await db.from("messages").select("*").eq("conversation_id",currentChatId).order("created_at",{ascending:true}).limit(200);
  if(error){$("chatMessages").innerHTML=`<p class="muted">${esc(error.message)}</p>`;return;}
  currentChatMessages=data||[];
  $("chatMessages").innerHTML=currentChatMessages.length?currentChatMessages.map(m=>`
    <div class="bubble ${m.sender_id===currentUser.id?"mine":"theirs"}">${esc(m.content)}</div>`).join(""):`<div class="empty-state">Say hello and start the conversation.</div>`;
  $("chatMessages").scrollTop=$("chatMessages").scrollHeight;
}
async function sendMessage(){
  if(!requireLogin()||!currentChatId)return;
  const input=$("chatInput");
  const content=input.value.trim();
  if(!content)return;
  input.disabled=true;
  const {error}=await db.from("messages").insert({
    conversation_id:currentChatId,
    sender_id:currentUser.id,
    content
  });
  input.disabled=false;
  if(error){toast(error.message);return;}
  input.value="";
  await refreshChatMessages();
}

/* =========================
   START APPLICATION
========================= */
init().catch(error=>{
  console.error(error);
  $("pageContent").innerHTML=`<div class="card empty-state"><h3>Something went wrong</h3><p>${esc(error.message||"Please refresh the page.")}</p></div>`;
});
</script>
</body>
