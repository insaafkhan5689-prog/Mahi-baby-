
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahi Baby ❤️</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff7fa;
  color:#382b34;
}
header{
  padding:20px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 12px #0000000c;
}
.logo{color:#d94f83;font-size:23px;font-weight:bold}
button{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  background:#d94f83;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#755d70}
.danger{background:#c83252}
.container{max-width:1100px;margin:auto;padding:22px}
.panel{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 5px 25px #0000000b;
}
#authPanel{max-width:420px;margin:65px auto}
h1,h2{color:#c84f80}
input{
  width:100%;
  padding:14px;
  margin:8px 0 14px;
  border:1px solid #ead6e0;
  border-radius:10px;
  font-size:16px;
}
.auth-buttons{display:grid;gap:9px}
#app{display:none}
.toolbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin:20px 0;
}
.toolbar input{flex:1;min-width:180px;margin:0}
.upload-label{
  display:inline-block;
  background:#d94f83;
  color:white;
  border-radius:12px;
  padding:13px 18px;
  cursor:pointer;
  font-weight:bold;
}
#photoInput{display:none}
#gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:17px;
}
.photo-card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 15px #0000000d;
}
.photo-card img{
  width:100%;
  height:210px;
  object-fit:cover;
  display:block;
  cursor:pointer;
}
.photo-info{padding:12px}
.photo-name{font-size:13px;overflow-wrap:anywhere;margin-bottom:10px}
.photo-info button{width:100%;padding:9px}
#message,#authMessage{margin:12px 0;color:#a33b65;overflow-wrap:anywhere}
#adminBadge{
  display:none;
  background:#fff0f5;
  color:#bd3970;
  padding:8px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}
#viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  background:#160f16ed;
  align-items:center;
  justify-content:center;
  padding:20px;
}
#viewer img{max-width:95%;max-height:85vh;object-fit:contain}
#closeViewer{
  position:absolute;
  top:20px;
  right:20px;
  background:white;
  color:#333;
}
.muted{color:#877984;font-size:13px}
footer{text-align:center;padding:30px;color:#998994}
@media(max-width:500px){
  header{padding:15px}
  .container{padding:14px}
  #gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .photo-card img{height:155px}
  .panel{padding:20px}
}
</style>
</head>

<body>

<header>
  <div class="logo">❤️ Mahi Baby</div>
  <div>
    <span id="adminBadge">ADMIN 👑</span>
    <button id="logoutBtn" class="secondary" style="display:none">Logout</button>
  </div>
</header>

<section id="authPanel" class="panel">
  <h1>Welcome ❤️</h1>
  <p class="muted">A little space filled with memories.</p>

  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">

  <div class="auth-buttons">
    <button id="loginBtn">Login</button>
    <button id="signupBtn" class="secondary">Create Account</button>
    <button id="resetBtn" class="secondary">Forgot Password?</button>
  </div>
  <p id="authMessage"></p>
</section>

<main id="app">
  <div class="container">
    <section class="panel">
      <h1>Our Memories ❤️</h1>
      <p id="welcomeText"></p>
      <p class="muted">Share your favourite memories with everyone.</p>

      <div class="toolbar">
        <input id="searchInput" type="search"
               placeholder="🔍 Search photos by name...">

        <label for="photoInput" class="upload-label">
          ＋ Upload Photo
        </label>
        <input id="photoInput" type="file" accept="image/*">
      </div>

      <p id="message"></p>
      <p id="photoCount" class="muted"></p>

      <div id="gallery"></div>
    </section>
  </div>
</main>

<div id="viewer">
  <button id="closeViewer">✕ Close</button>
  <img id="viewerImage" alt="Selected photo">
</div>

<footer>Made with ❤️ for Mahi Baby</footer>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL =
'https://jhvmqedhxkahjroyquty.supabase.co';

const SUPABASE_KEY =
'sb_publishable_ItB77qS23ODZE5xlTCs5Xw_7AFljOyX';

const ADMIN_USER_ID =
'6b19250a-ab16-4e98-bae6-2f6473d8a4cb';

const BUCKET = 'mahi-photos';

const supabase = createClient(SUPABASE_URL,SUPABASE_KEY);

const $ = id => document.getElementById(id);

let currentUser = null;
let isAdmin = false;
let photos = [];

function authMessage(text){
  $('authMessage').textContent = text;
}

function message(text){
  $('message').textContent = text;
}

function showLogin(){
  currentUser = null;
  isAdmin = false;
  $('app').style.display = 'none';
  $('authPanel').style.display = 'block';
  $('logoutBtn').style.display = 'none';
  $('adminBadge').style.display = 'none';
}

async function checkAdmin(){
  const {data,error} = await supabase
    .from('admins')
    .select('user_id')
    .eq('user_id',currentUser.id)
    .maybeSingle();

  if(error){
    console.error('Admin verification:',error.message);
    return false;
  }

  return data?.user_id === ADMIN_USER_ID;
}

async function showApp(){
  const {data:{user},error} = await supabase.auth.getUser();

  if(error || !user){
    showLogin();
    return;
  }

  currentUser = user;
  isAdmin = await checkAdmin();

  $('authPanel').style.display = 'none';
  $('app').style.display = 'block';
  $('logoutBtn').style.display = 'inline-block';
  $('adminBadge').style.display = isAdmin ? 'inline-block' : 'none';

  $('welcomeText').textContent =
    'Welcome, ' + (user.email || 'User') + (isAdmin ? ' 👑' : ' ❤️');

  await loadPhotos();
}

async function login(){
  const email = $('email').value.trim();
  const password = $('password').value;

  if(!email || !password){
    authMessage('Enter email and password.');
    return;
  }

  $('loginBtn').disabled = true;
  const {error} = await supabase.auth.signInWithPassword({
    email,password
  });
  $('loginBtn').disabled = false;

  if(error){
    authMessage(error.message);
    return;
  }

  authMessage('');
  await showApp();
}

async function signup(){
  const email = $('email').value.trim();
  const password = $('password').value;

  if(!email || password.length < 6){
    authMessage('Enter a valid email and password of at least 6 characters.');
    return;
  }

  const {error} = await supabase.auth.signUp({
    email,password
  });

  authMessage(error
    ? error.message
    : 'Registration successful. Check your email if verification is required.');
}

async function resetPassword(){
  const email = $('email').value.trim();

  if(!email){
    authMessage('Enter your email address first.');
    return;
  }

  const {error} = await supabase.auth.resetPasswordForEmail(email);

  authMessage(error
    ? error.message
    : 'Password reset email sent. Check your inbox.');
}

async function logout(){
  const {error} = await supabase.auth.signOut();

  if(error){
    message(error.message);
    return;
  }

  photos = [];
  showLogin();
}

async function loadPhotos(){
  message('Loading photos...');
  $('gallery').replaceChildren();

  const {data,error} = await supabase.storage
    .from(BUCKET)
    .list('',{
      limit:100,
      offset:0,
      sortBy:{column:'created_at',order:'desc'}
    });

  if(error){
    message('Could not load photos: ' + error.message);
    return;
  }

  const files = (data || []).filter(file =>
    file.name && file.name !== '.emptyFolderPlaceholder'
  );

  photos = [];

  for(const file of files){
    const path = file.name;

    const {data:signed,error:signedError} = await supabase.storage
      .from(BUCKET)
      .createSignedUrl(path,3600);

    if(signedError){
      console.error(signedError.message);
      continue;
    }

    photos.push({
      name:path,
      url:signed.signedUrl
    });
  }

  message('');
  renderGallery();
}

function renderGallery(){
  const gallery = $('gallery');
  gallery.replaceChildren();

  const term = $('searchInput').value.trim().toLowerCase();

  const filtered = photos.filter(photo =>
    photo.name.toLowerCase().includes(term)
  );

  $('photoCount').textContent =
    filtered.length + ' photo(s) found';

  if(!filtered.length){
    const empty = document.createElement('p');
    empty.textContent = 'No photos found. Upload a memory ❤️';
    gallery.appendChild(empty);
    return;
  }

  for(const photo of filtered){
    const card = document.createElement('article');
    card.className = 'photo-card';

    const img = document.createElement('img');
    img.src = photo.url;
    img.alt = photo.name;
    img.loading = 'lazy';
    img.addEventListener('click',() => {
      $('viewerImage').src = photo.url;
      $('viewer').style.display = 'flex';
    });

    const info = document.createElement('div');
    info.className = 'photo-info';

    const name = document.createElement('div');
    name.className = 'photo-name';
    name.textContent = photo.name;

    info.appendChild(name);

    if(isAdmin){
      const del = document.createElement('button');
      del.className = 'danger';
      del.textContent = 'Delete Photo';
      del.addEventListener('click',() => deletePhoto(photo.name));
      info.appendChild(del);
    }

    card.append(img,info);
    gallery.appendChild(card);
  }
}

async function uploadPhoto(file){
  if(!file || !currentUser) return;

  if(!file.type.startsWith('image/')){
    message('Please select an image file.');
    return;
  }

  if(file.size > 10 * 1024 * 1024){
    message('Maximum image size is 10 MB.');
    return;
  }

  const safeName = file.name
    .replace(/[^a-zA-Z0-9._-]/g,'_')
    .slice(-90);

  const path =
    currentUser.id + '_' + Date.now() + '_' + safeName;

  message('Uploading photo...');

  const {error} = await supabase.storage
    .from(BUCKET)
    .upload(path,file,{
      contentType:file.type,
      upsert:false
    });

  if(error){
    message('Upload failed: ' + error.message);
    return;
  }

  $('photoInput').value = '';
  message('Photo uploaded successfully! ❤️');
  await loadPhotos();
}

async function deletePhoto(path){
  if(!isAdmin || currentUser.id !== ADMIN_USER_ID){
    message('Only the admin can delete photos.');
    return;
  }

  if(!confirm('Are you sure you want to delete this photo?')) return;

  const {error} = await supabase.storage
    .from(BUCKET)
    .remove([path]);

  if(error){
    message('Delete failed: ' + error.message);
    return;
  }

  message('Photo deleted successfully.');
  await loadPhotos();
}

$('loginBtn').addEventListener('click',login);
$('signupBtn').addEventListener('click',signup);
$('resetBtn').addEventListener('click',resetPassword);
$('logoutBtn').addEventListener('click',logout);

$('photoInput').addEventListener('change',event => {
  uploadPhoto(event.target.files[0]);
});

$('searchInput').addEventListener('input',renderGallery);

$('closeViewer').addEventListener('click',() => {
  $('viewer').style.display = 'none';
  $('viewerImage').src = '';
});

$('viewer').addEventListener('click',event => {
  if(event.target === $('viewer')){
    $('viewer').style.display = 'none';
    $('viewerImage').src = '';
  }
});

const {data:{session}} = await supabase.auth.getSession();

if(session){
  await showApp();
}else{
  showLogin();
}
</script>
</body>
</html>
