
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahi Baby ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff0f5,#ffe0ec);color:#452333}
header{background:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 15px #0001;position:sticky;top:0;z-index:5}
h1{margin:0;color:#e84c87;font-size:23px}
main{max-width:950px;margin:auto;padding:20px}
.panel{background:white;padding:20px;border-radius:18px;box-shadow:0 5px 20px #0000000d;margin-bottom:18px}
.auth{max-width:420px;margin:55px auto}
.auth h2{text-align:center;color:#e84c87}
input{width:100%;padding:13px;margin:8px 0 14px;border:1px solid #edc6d6;border-radius:10px;font-size:16px}
button{border:0;border-radius:11px;padding:12px 17px;background:#e84c87;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#74445d}
.danger{background:#c93655}
.hidden{display:none!important}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px;margin-top:18px}
.photo{background:#fff0f5;border-radius:13px;overflow:hidden}
.photo img{width:100%;height:175px;object-fit:cover;display:block;cursor:pointer}
.photo-info{padding:9px;font-size:12px;overflow-wrap:anywhere}
.photo-info button{padding:8px;margin-top:7px;font-size:12px}
.small{font-size:13px;color:#80596d}
.status{margin-top:12px;font-weight:bold;overflow-wrap:anywhere}
#viewer{position:fixed;inset:0;background:#000e;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}
#viewer img{max-width:100%;max-height:85vh;object-fit:contain}
#viewer button{position:absolute;top:20px;right:20px}
</style>
</head>
<body>

<header>
<h1>💗 Mahi Baby</h1>
<button id="logoutBtn" class="secondary hidden">Logout</button>
</header>

<main>
<section id="authSection" class="panel auth">
<h2>Welcome to Mahi Baby ❤️</h2>
<p class="small">Login or create your account</p>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<div class="actions">
<button id="loginBtn">Login</button>
<button id="signupBtn" class="secondary">Sign Up</button>
</div>
<p><button id="resetBtn" class="secondary">Forgot Password?</button></p>
<div id="authMessage" class="status"></div>
</section>

<section id="appSection" class="hidden">
<div class="panel">
<h2 id="welcome">Welcome ❤️</h2>
<p id="roleText" class="small">Photo Gallery</p>
</div>

<div id="adminPanel" class="panel hidden">
<h2>👑 Admin Dashboard</h2>
<p>Administrator account detected.</p>
<p class="small">You can manage photos in the gallery.</p>
</div>

<div class="panel">
<h2>📸 Upload Photos</h2>
<input id="photoInput" type="file" accept="image/*">
<button id="uploadBtn">Upload Photo</button>
<div id="uploadMessage" class="status"></div>
<p class="small">Image files only. Maximum size: 10 MB.</p>
</div>

<div class="panel">
<h2>💖 Photo Gallery</h2>
<input id="searchInput" type="search" placeholder="Search by photo filename...">
<button id="refreshBtn" class="secondary">Refresh Gallery</button>
<div id="galleryMessage" class="status"></div>
<div id="gallery" class="gallery"></div>
</div>
</section>
</main>

<div id="viewer" class="hidden">
<button id="closeViewer">Close ✕</button>
<img id="viewerImage" alt="Photo preview">
</div>

<script>
const SUPABASE_URL = "https://jhvmqedhxkahjroyquty.supabase.co";
const SUPABASE_KEY = "sb_publishable_ItB77qS23ODZE5xlTCs5Xw_7AFljOyX";

// Must exactly match the bucket ID in Supabase Storage
const BUCKET = "Mahi Baby";

const ADMIN_UID = "6b19250a-ab16-4e98-bae6-2f6473d8a4cb";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

let currentUser = null;
let isAdmin = false;
let allPhotos = [];

function message(id,text,error=false){
  $(id).textContent = text;
  $(id).style.color = error ? "#c62828" : "#25834a";
}

async function checkAdmin(){
  const {data,error} = await db
    .from("admins")
    .select("user_id")
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(error){
    console.error("Admin check:",error);
    return false;
  }
  return !!data && data.user_id === ADMIN_UID;
}

async function enterApp(user){
  currentUser = user;
  isAdmin = await checkAdmin();

  $("authSection").classList.add("hidden");
  $("appSection").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");

  $("welcome").textContent = "Welcome ❤️";
  $("roleText").textContent = isAdmin
    ? "👑 Administrator account"
    : "Welcome to the photo gallery";

  $("adminPanel").classList.toggle("hidden",!isAdmin);
  await loadGallery();
}

async function login(){
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password)
    return message("authMessage","Enter email and password.",true);

  $("loginBtn").disabled = true;
  message("authMessage","Logging in...");

  const {data,error} = await db.auth.signInWithPassword({email,password});
  $("loginBtn").disabled = false;

  if(error) return message("authMessage",error.message,true);
  await enterApp(data.user);
}

async function signup(){
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password)
    return message("authMessage","Enter email and password.",true);

  if(password.length < 6)
    return message("authMessage","Password must be at least 6 characters.",true);

  $("signupBtn").disabled = true;
  message("authMessage","Creating account...");

  const {data,error} = await db.auth.signUp({email,password});
  $("signupBtn").disabled = false;

  if(error) return message("authMessage",error.message,true);

  if(data.session && data.user){
    await enterApp(data.user);
  }else{
    message("authMessage","Account created. Check your email to confirm, then log in.");
  }
}

async function resetPassword(){
  const email = $("email").value.trim();

  if(!email)
    return message("authMessage","Enter your email address first.",true);

  const {error} = await db.auth.resetPasswordForEmail(email,{
    redirectTo:window.location.origin
  });

  message("authMessage",
    error ? error.message : "Password reset email sent.",
    !!error
  );
}

async function logout(){
  await db.auth.signOut();
  currentUser = null;
  isAdmin = false;
  allPhotos = [];

  $("appSection").classList.add("hidden");
  $("authSection").classList.remove("hidden");
  $("logoutBtn").classList.add("hidden");
  $("gallery").innerHTML = "";
  message("authMessage","You have logged out.");
}

async function loadGallery(){
  $("gallery").innerHTML = "";
  message("galleryMessage","Loading photos...");

  const {data,error} = await db.storage.from(BUCKET).list("",{
    limit:200,
    sortBy:{column:"created_at",order:"desc"}
  });

  if(error)
    return message("galleryMessage","Gallery error: "+error.message,true);

  allPhotos = (data || []).filter(file =>
    file.name && file.name !== ".emptyFolderPlaceholder"
  );

  renderGallery();
}

function renderGallery(){
  const term = $("searchInput").value.trim().toLowerCase();

  const filtered = allPhotos.filter(file =>
    file.name.toLowerCase().includes(term)
  );

  $("gallery").innerHTML = "";

  if(filtered.length === 0){
    message("galleryMessage",
      allPhotos.length ? "No matching photos found." : "No photos uploaded yet."
    );
    return;
  }

  message("galleryMessage",filtered.length+" photo(s) found.");

  filtered.forEach(file => {
    const card = document.createElement("div");
    card.className = "photo";

    const img = document.createElement("img");
    img.alt = file.name;
    img.loading = "lazy";
    img.addEventListener("click",()=>openViewer(img.src));

    const info = document.createElement("div");
    info.className = "photo-info";

    const name = document.createElement("div");
    name.textContent = file.name;
    info.appendChild(name);

    if(isAdmin){
      const del = document.createElement("button");
      del.className = "danger";
      del.textContent = "Delete Photo";
      del.addEventListener("click",()=>deletePhoto(file.name));
      info.appendChild(del);
    }

    card.appendChild(img);
    card.appendChild(info);
    $("gallery").appendChild(card);

    db.storage.from(BUCKET).createSignedUrl(file.name,3600)
      .then(({data,error})=>{
        if(error){
          img.alt = "Unable to load image";
          console.error(error);
        }else{
          img.src = data.signedUrl;
        }
      });
  });
}

async function uploadPhoto(){
  const file = $("photoInput").files[0];

  if(!file)
    return message("uploadMessage","Please select a photo first.",true);

  if(!file.type.startsWith("image/"))
    return message("uploadMessage","Only image files are allowed.",true);

  if(file.size > 10*1024*1024)
    return message("uploadMessage","Photo must be smaller than 10 MB.",true);

  $("uploadBtn").disabled = true;
  message("uploadMessage","Uploading photo...");

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path = currentUser.id+"_"+Date.now()+"_"+safeName;

  const {error} = await db.storage.from(BUCKET).upload(path,file,{
    contentType:file.type,
    upsert:false
  });

  $("uploadBtn").disabled = false;

  if(error)
    return message("uploadMessage","Upload failed: "+error.message,true);

  $("photoInput").value = "";
  message("uploadMessage","Photo uploaded successfully! ❤️");
  await loadGallery();
}

async function deletePhoto(filename){
  if(!isAdmin)
    return alert("Only admin can delete photos.");

  if(!confirm("Are you sure you want to delete this photo?"))
    return;

  const {error} = await db.storage.from(BUCKET).remove([filename]);

  if(error){
    alert("Delete failed: "+error.message);
    return;
  }

  alert("Photo deleted.");
  await loadGallery();
}

function openViewer(src){
  $("viewerImage").src = src;
  $("viewer").classList.remove("hidden");
}

function closeViewer(){
  $("viewer").classList.add("hidden");
  $("viewerImage").src = "";
}

$("loginBtn").addEventListener("click",login);
$("signupBtn").addEventListener("click",signup);
$("resetBtn").addEventListener("click",resetPassword);
$("logoutBtn").addEventListener("click",logout);
$("uploadBtn").addEventListener("click",uploadPhoto);
$("refreshBtn").addEventListener("click",loadGallery);
$("searchInput").addEventListener("input",renderGallery);
$("closeViewer").addEventListener("click",closeViewer);

$("viewer").addEventListener("click",e=>{
  if(e.target === $("viewer")) closeViewer();
});

db.auth.getSession().then(({data,error})=>{
  if(error) console.error(error);
  if(data.session) enterApp(data.session.user);
});
</script>
</body>
</html>
