
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101112">
<title>Mahi Baby — Photo Community</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#101112;
  --panel:#191b1e;
  --panel2:#202327;
  --text:#f5f5f5;
  --muted:#999fa8;
  --accent:#b7f36b;
  --line:#2c3035;
  --danger:#ff6464;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,Arial,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.topbar{
  position:sticky;top:0;z-index:20;
  background:#101112ed;backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
  padding:14px 18px;display:flex;align-items:center;
  justify-content:space-between;
}
.brand{font-size:22px;font-weight:850;letter-spacing:-1px}
.brand span{color:var(--accent)}
.top-actions{display:flex;gap:9px}
.icon-btn{
  width:40px;height:40px;border-radius:14px;
  border:1px solid var(--line);background:var(--panel);
  color:white;font-size:18px;
}
main{max-width:760px;margin:auto;padding:18px 14px 110px}
.welcome{
  padding:22px;border-radius:22px;
  background:linear-gradient(135deg,#252b24,#17191b 65%);
  border:1px solid #394332;margin-bottom:20px;
}
.welcome h1{font-size:27px;margin:0 0 8px}
.welcome p{color:var(--muted);margin:0;line-height:1.5}
.section-head{
  display:flex;justify-content:space-between;align-items:center;
  margin:22px 2px 13px;
}
.section-head h2{font-size:18px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}
.pill{
  white-space:nowrap;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);
  padding:9px 15px;border-radius:30px;
}
.pill.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:750}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:20px;overflow:hidden;margin-bottom:17px;
}
.post-head{display:flex;align-items:center;gap:11px;padding:14px}
.avatar{
  width:42px;height:42px;border-radius:50%;object-fit:cover;
  background:#343a3e;display:grid;place-items:center;
  font-weight:800;color:var(--accent);flex-shrink:0;
}
.post-user{font-size:14px;font-weight:750}
.post-date{font-size:11px;color:var(--muted);margin-top:3px}
.post-image{
  width:100%;max-height:650px;object-fit:contain;
  display:block;background:#090a0b;
}
.post-caption{padding:12px 15px 4px;line-height:1.5;font-size:14px}
.post-actions{display:flex;align-items:center;gap:7px;padding:10px 12px 13px}
.action{
  border:0;background:transparent;color:#c6cbd0;
  padding:8px 9px;border-radius:12px;font-size:14px;
}
.action:hover{background:var(--panel2)}
.action.liked{color:#ff7189}
.action.saved{color:var(--accent)}
.action.delete{color:var(--danger);margin-left:auto}
.empty{
  text-align:center;padding:38px 20px;
  background:var(--panel);border:1px dashed #41464d;
  border-radius:20px;color:var(--muted);
}
.empty strong{display:block;color:white;font-size:17px;margin-bottom:8px}
.field{
  width:100%;background:#111315;color:white;
  border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;outline:none;margin:7px 0 13px;
}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:100px;resize:vertical}
.primary{
  width:100%;border:0;border-radius:13px;padding:14px;
  background:var(--accent);color:#111;font-weight:800;
}
.secondary{
  border:1px solid var(--line);background:var(--panel2);
  color:white;border-radius:12px;padding:11px 14px;
}
.danger{
  border:1px solid #703737;background:#2a1717;
  color:#ff8888;border-radius:12px;padding:11px 14px;
}
.panel{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:17px;margin-bottom:15px;
}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;
}
.grid img{
  width:100%;aspect-ratio:1;object-fit:cover;
  border-radius:13px;background:#222;
}
.bottom-nav{
  position:fixed;z-index:30;bottom:0;left:0;right:0;
  background:#141618f5;backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:9px 3px calc(9px + env(safe-area-inset-bottom));
}
.nav-item{
  background:transparent;border:0;color:#858b93;
  display:flex;flex-direction:column;align-items:center;
  gap:4px;font-size:10px;min-width:0;flex:1;
}
.nav-item b{font-size:19px;font-weight:500}
.nav-item.active{color:var(--accent)}
.nav-item.active b{font-weight:800}
.modal{
  display:none;position:fixed;inset:0;z-index:60;
  background:#000b;align-items:flex-end;justify-content:center;
}
.modal.show{display:flex}
.modal-box{
  width:100%;max-width:650px;max-height:85vh;overflow:auto;
  background:#191b1e;border:1px solid var(--line);
  border-radius:23px 23px 0 0;padding:20px;
}
.modal-top{display:flex;justify-content:space-between;align-items:center}
.modal-top h3{margin:0}
.close{
  border:0;background:#30343a;color:white;
  border-radius:10px;padding:8px 12px;
}
.comment{
  padding:12px 0;border-bottom:1px solid var(--line);
  font-size:14px;line-height:1.5;
}
.comment strong{color:var(--accent)}
.status{font-size:13px;color:var(--muted);margin:8px 0}
.notice{
  padding:12px;border-radius:12px;background:#252a21;
  color:#d5efbd;font-size:13px;margin:10px 0;
}
.hidden{display:none!important}
@media(min-width:700px){
  main{padding-top:25px}
  .bottom-nav{left:50%;transform:translateX(-50%);width:min(100%,760px);border-radius:18px 18px 0 0}
  .modal{align-items:center}
  .modal-box{border-radius:22px}
}
</style>
</head>

<body>
<header class="topbar">
  <div class="brand">MAHI<span> BABY</span></div>
  <div class="top-actions">
    <button class="icon-btn" onclick="go('search')" aria-label="Search">⌕</button>
    <button class="icon-btn" onclick="openAuth()" aria-label="Account">♙</button>
  </div>
</header>

<main id="app">
  <div class="welcome">
    <h1>Welcome to Mahi Baby</h1>
    <p>A place to discover, share and save moments. Explore public photos without creating an account.</p>
  </div>
  <div class="empty">Loading community...</div>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="home" onclick="go('home')"><b>⌂</b>Home</button>
  <button class="nav-item" data-page="explore" onclick="go('explore')"><b>▦</b>Explore</button>
  <button class="nav-item" data-page="search" onclick="go('search')"><b>⌕</b>Search</button>
  <button class="nav-item" data-page="upload" onclick="go('upload')"><b>＋</b>Upload</button>
  <button class="nav-item" data-page="activity" onclick="go('activity')"><b>♡</b>Activity</button>
  <button class="nav-item" data-page="profile" onclick="go('profile')"><b>◉</b>Profile</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-top">
      <h3 id="modalTitle">Mahi Baby</h3>
      <button class="close" onclick="closeModal()">Close</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
/* ---------- PROJECT CONFIGURATION ---------- */
const SUPABASE_URL = 'https://jhvmqedhxkahjroyquty.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ItB77qS23ODZE5xlTCs5Xw_7AFljOyX';
const BUCKET = 'Mahi baby';
const ADMIN_UID = '6b19250a-ab16-4e98-bae6-2f6473d8a4cb';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentPage = 'home';
let feedMode = 'latest';
let cachedPosts = [];
let currentCommentPost = null;
let searchTimer = null;

/* ---------- HELPERS ---------- */
function esc(value=''){
  return String(value).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function timeAgo(date){
  const seconds=Math.floor((Date.now()-new Date(date).getTime())/1000);
  if(seconds<60)return 'Just now';
  if(seconds<3600)return Math.floor(seconds/60)+'m ago';
  if(seconds<86400)return Math.floor(seconds/3600)+'h ago';
  if(seconds<604800)return Math.floor(seconds/86400)+'d ago';
  return new Date(date).toLocaleDateString();
}
function notify(message){
  const old=document.getElementById('toast');
  if(old)old.remove();
  const el=document.createElement('div');
  el.id='toast';el.textContent=message;
  el.style.cssText='position:fixed;z-index:100;bottom:90px;left:50%;transform:translateX(-50%);background:#303630;color:white;padding:13px 18px;border-radius:13px;max-width:90%;font-size:13px;box-shadow:0 8px 30px #0008';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}
function showModal(title,html){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function requireLogin(){
  if(currentUser)return true;
  notify('Please sign in to use this feature.');
  openAuth();
  return false;
}
function displayName(userId){
  if(currentUser && currentUser.id===userId){
    return currentUser.user_metadata?.display_name || currentUser.email?.split('@')[0] || 'You';
  }
  return 'Community member';
}
function avatarHTML(userId){
  const isMe=currentUser && currentUser.id===userId;
  const avatar=isMe?currentUser.user_metadata?.avatar_url:null;
  const name=isMe?displayName(userId):'M';
  return avatar
    ? `<img class="avatar" src="${esc(avatar)}" alt="Profile photo">`
    : `<div class="avatar">${esc(name.slice(0,1).toUpperCase())}</div>`;
}
async function getImageUrl(path){
  if(!path)return '';
  if(/^https?:\/\//i.test(path))return path;
  const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,3600);
  if(error){console.error(error);return '';}
  return data?.signedUrl || '';
}

/* ---------- NAVIGATION ---------- */
function setActiveNav(page){
  document.querySelectorAll('.nav-item').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.page===page);
  });
}
function go(page){
  currentPage=page;
  setActiveNav(page);
  if(page==='home')loadHome();
  else if(page==='explore')loadExplore();
  else if(page==='search')loadSearch();
  else if(page==='upload')loadUpload();
  else if(page==='activity')loadActivity();
  else if(page==='profile')loadProfile();
}

/* ---------- HOME / EXPLORE ---------- */
async function loadHome(){
  document.getElementById('app').innerHTML=`
    <div class="welcome">
      <h1>Your community, your moments.</h1>
      <p>Discover photos shared by the Mahi Baby community.</p>
    </div>
    <div class="section-head"><h2>Community Feed</h2></div>
    <div class="tabs">
      <button class="pill ${feedMode==='latest'?'active':''}" onclick="setFeed('latest')">Latest</button>
      <button class="pill ${feedMode==='trending'?'active':''}" onclick="setFeed('trending')">Trending</button>
    </div>
    <div id="feed"><div class="empty">Loading photos...</div></div>`;
  await fetchPosts('home');
}
function setFeed(mode){feedMode=mode;loadHome()}
async function loadExplore(){
  document.getElementById('app').innerHTML=`
    <div class="section-head"><h2>Explore</h2><span class="muted small">Discover moments</span></div>
    <div class="panel"><p class="muted">Browse the latest public photos from the community.</p>
    <button class="secondary" onclick="go('search')">⌕ Search photos</button></div>
    <div id="feed"><div class="empty">Loading photos...</div></div>`;
  await fetchPosts('explore');
}
async function fetchPosts(target){
  const container=document.getElementById('feed');
  if(!container)return;
  const {data:posts,error}=await sb.from('photo_posts')
    .select('id,user_id,storage_path,caption,created_at')
    .order('created_at',{ascending:false}).limit(60);
  if(error){
    container.innerHTML=`<div class="empty"><strong>Could not load photos</strong>${esc(error.message)}</div>`;
    return;
  }
  cachedPosts=posts||[];
  if(!cachedPosts.length){
    container.innerHTML='<div class="empty"><strong>No photos yet</strong>Be the first to share a moment.</div>';
    return;
  }

  const ids=cachedPosts.map(p=>p.id);
  const [likesResult,commentsResult,myLikesResult,mySavesResult]=await Promise.all([
    sb.from('photo_likes').select('post_id').in('post_id',ids),
    sb.from('photo_comments').select('post_id').in('post_id',ids),
    currentUser?sb.from('photo_likes').select('post_id').eq('user_id',currentUser.id).in('post_id',ids):Promise.resolve({data:[]}),
    currentUser?sb.from('photo_saves').select('post_id').eq('user_id',currentUser.id).in('post_id',ids):Promise.resolve({data:[]})
  ]);
  const likeCounts={},commentCounts={};
  (likesResult.data||[]).forEach(x=>likeCounts[x.post_id]=(likeCounts[x.post_id]||0)+1);
  (commentsResult.data||[]).forEach(x=>commentCounts[x.post_id]=(commentCounts[x.post_id]||0)+1);
  const myLikes=new Set((myLikesResult.data||[]).map(x=>x.post_id));
  const mySaves=new Set((mySavesResult.data||[]).map(x=>x.post_id));

  let ordered=[...cachedPosts];
  if(target==='home' && feedMode==='trending'){
    ordered.sort((a,b)=>(likeCounts[b.id]||0)-(likeCounts[a.id]||0));
  }
  const html=[];
  for(const post of ordered){
    const url=await getImageUrl(post.storage_path);
    if(!url)continue;
    html.push(postCard(post,url,likeCounts[post.id]||0,commentCounts[post.id]||0,myLikes.has(post.id),mySaves.has(post.id)));
  }
  container.innerHTML=html.join('')||'<div class="empty">No viewable photos found. Check the storage bucket settings.</div>';
}
function postCard(post,url,likes,comments,liked,saved){
  const owner=currentUser && currentUser.id===post.user_id;
  const admin=currentUser && currentUser.id===ADMIN_UID;
  return `<article class="card" id="post-${esc(post.id)}">
    <div class="post-head">
      ${avatarHTML(post.user_id)}
      <div style="flex:1;min-width:0">
        <div class="post-user">${esc(displayName(post.user_id))}</div>
        <div class="post-date">${esc(timeAgo(post.created_at))}</div>
      </div>
      ${owner||admin?`<button class="action delete" onclick="deletePost('${esc(post.id)}','${esc(post.storage_path)}')">Delete</button>`:''}
    </div>
    <img class="post-image" src="${esc(url)}" loading="lazy" alt="Community photo">
    ${post.caption?`<div class="post-caption">${esc(post.caption)}</div>`:''}
    <div class="post-actions">
      <button class="action ${liked?'liked':''}" onclick="toggleLike('${esc(post.id)}')">${liked?'♥':'♡'} ${likes}</button>
      <button class="action" onclick="openComments('${esc(post.id)}')">▢ ${comments} Comments</button>
      <button class="action ${saved?'saved':''}" onclick="toggleSave('${esc(post.id)}')">${saved?'▣ Saved':'▢ Save'}</button>
    </div>
  </article>`;
}

/* ---------- SEARCH ---------- */
function loadSearch(){
  document.getElementById('app').innerHTML=`
    <div class="section-head"><h2>Search</h2></div>
    <input id="searchInput" class="field" placeholder="Search captions and photos..." oninput="searchPhotos(this.value)">
    <p class="muted small">Search public photo captions.</p>
    <div id="searchResults"><div class="empty">Type something to search.</div></div>`;
}
async function searchPhotos(value){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(async()=>{
    const q=value.trim();
    const box=document.getElementById('searchResults');
    if(!box)return;
    if(q.length<2){box.innerHTML='<div class="empty">Enter at least 2 characters.</div>';return;}
    box.innerHTML='<div class="empty">Searching...</div>';
    const {data,error}=await sb.from('photo_posts')
      .select('id,user_id,storage_path,caption,created_at')
      .ilike('caption','%'+q.replace(/[%_]/g,'')+'%')
      .order('created_at',{ascending:false}).limit(40);
    if(error){box.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return;}
    if(!data?.length){box.innerHTML='<div class="empty"><strong>No results</strong>Try another search.</div>';return;}
    let html='';
    for(const p of data){
      const url=await getImageUrl(p.storage_path);
      if(url)html+=`<div class="card" style="padding:10px;display:flex;gap:12px;align-items:center">
        <img src="${esc(url)}" style="width:78px;height:78px;object-fit:cover;border-radius:12px">
        <div><b>${esc(p.caption||'Photo')}</b><div class="muted small">${esc(timeAgo(p.created_at))}</div></div>
      </div>`;
    }
    box.innerHTML=html||'<div class="empty">No viewable photos.</div>';
  },350);
}

/* ---------- AUTH ---------- */
function openAuth(){
  if(currentUser){loadProfile();return;}
  showModal('Welcome back',`
    <div class="tabs" style="margin-top:18px">
      <button class="pill active" id="loginTab" onclick="authMode('login')">Login</button>
      <button class="pill" id="signupTab" onclick="authMode('signup')">Create account</button>
    </div>
    <form id="authForm" onsubmit="submitAuth(event)">
      <label class="muted small">Email address</label>
      <input class="field" type="email" id="authEmail" required placeholder="you@example.com">
      <label class="muted small">Password</label>
      <input class="field" type="password" id="authPassword" required minlength="6" placeholder="At least 6 characters">
      <input class="field hidden" id="authName" placeholder="Your display name">
      <button class="primary" id="authSubmit">Login</button>
    </form>
    <button class="action" onclick="forgotPassword()">Forgot password?</button>
    <p class="status" id="authStatus">You can browse public photos without an account.</p>`);
  window.authCurrentMode='login';
}
function authMode(mode){
  window.authCurrentMode=mode;
  document.getElementById('loginTab').classList.toggle('active',mode==='login');
  document.getElementById('signupTab').classList.toggle('active',mode==='signup');
  document.getElementById('authName').classList.toggle('hidden',mode!=='signup');
  document.getElementById('authName').required=mode==='signup';
  document.getElementById('authSubmit').textContent=mode==='login'?'Login':'Create account';
}
async function submitAuth(e){
  e.preventDefault();
  const status=document.getElementById('authStatus');
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const name=document.getElementById('authName').value.trim();
  status.textContent='Please wait...';
  let result;
  if(window.authCurrentMode==='signup'){
    result=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});
  }else{
    result=await sb.auth.signInWithPassword({email,password});
  }
  if(result.error){status.textContent=result.error.message;return;}
  if(window.authCurrentMode==='signup' && !result.data.session){
    status.textContent='Account created. Check your email if confirmation is required.';
    return;
  }
  currentUser=result.data.user;
  closeModal();notify('You are signed in.');
  go('profile');
}
async function forgotPassword(){
  const email=document.getElementById('authEmail')?.value.trim();
  if(!email){notify('Enter your email address first.');return;}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});
  notify(error?error.message:'Password reset email requested.');
}

/* ---------- UPLOAD ---------- */
function loadUpload(){
  if(!currentUser){
    document.getElementById('app').innerHTML=`
      <div class="panel"><h2>Share a moment</h2>
      <p class="muted">You need an account to upload photos. Everyone can browse public posts without logging in.</p>
      <button class="primary" onclick="openAuth()">Login / Create account</button></div>`;
    return;
  }
  document.getElementById('app').innerHTML=`
    <div class="section-head"><h2>Create a post</h2></div>
    <div class="panel">
      <label class="muted small">Choose a photo</label>
      <input class="field" id="photoFile" type="file" accept="image/*">
      <div id="photoPreview"></div>
      <label class="muted small">Caption</label>
      <textarea class="field" id="photoCaption" maxlength="1000" placeholder="Write something about this moment..."></textarea>
      <button class="primary" id="uploadButton" onclick="uploadPhoto()">Share photo</button>
      <p class="status" id="uploadStatus">Maximum recommended image size: 10 MB.</p>
    </div>`;
  document.getElementById('photoFile').addEventListener('change',e=>{
    const f=e.target.files[0];
    document.getElementById('photoPreview').innerHTML=f?`<img src="${URL.createObjectURL(f)}" style="width:100%;max-height:300px;object-fit:contain;border-radius:14px">`:'';
  });
}
async function uploadPhoto(){
  if(!requireLogin())return;
  const file=document.getElementById('photoFile').files[0];
  const caption=document.getElementById('photoCaption').value.trim();
  const status=document.getElementById('uploadStatus');
  const button=document.getElementById('uploadButton');
  if(!file){notify('Choose a photo first.');return;}
  if(!file.type.startsWith('image/')){notify('Please choose an image file.');return;}
  if(file.size>10*1024*1024){notify('Image must be smaller than 10 MB.');return;}
  button.disabled=true;status.textContent='Uploading photo...';
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=currentUser.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
  const {error:uploadError}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});
  if(uploadError){
    status.textContent=uploadError.message;button.disabled=false;return;
  }
  const {error:postError}=await sb.from('photo_posts').insert({
    user_id:currentUser.id,storage_path:path,caption
  });
  if(postError){
    await sb.storage.from(BUCKET).remove([path]);
    status.textContent=postError.message;button.disabled=false;return;
  }
  notify('Your photo has been shared!');
  go('home');
}

/* ---------- LIKES / SAVES ---------- */
async function toggleLike(postId){
  if(!requireLogin())return;
  const {data:existing,error:findError}=await sb.from('photo_likes')
    .select('post_id').eq('post_id',postId).eq('user_id',currentUser.id).maybeSingle();
  if(findError){notify(findError.message);return;}
  let result;
  if(existing){
    result=await sb.from('photo_likes').delete().eq('post_id',postId).eq('user_id',currentUser.id);
  }else{
    result=await sb.from('photo_likes').insert({post_id:postId,user_id:currentUser.id});
  }
  if(result.error){notify(result.error.message);return;}
  if(currentPage==='home')loadHome();
  else if(currentPage==='explore')loadExplore();
}
async function toggleSave(postId){
  if(!requireLogin())return;
  const {data:existing,error}=await sb.from('photo_saves')
    .select('post_id').eq('post_id',postId).eq('user_id',currentUser.id).maybeSingle();
  if(error){notify(error.message);return;}
  const result=existing
    ? await sb.from('photo_saves').delete().eq('post_id',postId).eq('user_id',currentUser.id)
    : await sb.from('photo_saves').insert({post_id:postId,user_id:currentUser.id});
  if(result.error){notify(result.error.message);return;}
  notify(existing?'Removed from saved':'Photo saved');
  if(currentPage==='home')loadHome();
  else if(currentPage==='explore')loadExplore();
}

/* ---------- COMMENTS ---------- */
async function openComments(postId){
  currentCommentPost=postId;
  showModal('Comments','<div class="empty">Loading comments...</div>');
  const {data,error}=await sb.from('photo_comments')
    .select('user_id,content,created_at').eq('post_id',postId)
    .order('created_at',{ascending:true}).limit(100);
  if(error){
    document.getElementById('modalContent').innerHTML=`<div class="empty">${esc(error.message)}</div>`;
    return;
  }
  let html=(data||[]).map(c=>`
    <div class="comment"><strong>${esc(displayName(c.user_id))}</strong>
    <div>${esc(c.content)}</div><div class="muted small">${esc(timeAgo(c.created_at))}</div></div>`).join('');
  if(!html)html='<p class="muted">No comments yet. Start the conversation.</p>';
  if(currentUser){
    html+=`<form onsubmit="sendComment(event)">
      <textarea class="field" id="commentText" maxlength="1000" required placeholder="Write a comment..."></textarea>
      <button class="primary">Post comment</button>
    </form>`;
  }else{
    html+='<button class="primary" onclick="closeModal();openAuth()">Login to comment</button>';
  }
  document.getElementById('modalContent').innerHTML=html;
}
async function sendComment(e){
  e.preventDefault();
  if(!requireLogin())return;
  const content=document.getElementById('commentText').value.trim();
  if(!content)return;
  const {error}=await sb.from('photo_comments').insert({
    post_id:currentCommentPost,user_id:currentUser.id,content
  });
  if(error){notify(error.message);return;}
  notify('Comment posted.');
  await openComments(currentCommentPost);
  if(currentPage==='home')loadHome();
}

/* ---------- DELETE POST ---------- */
async function deletePost(postId,path){
  if(!requireLogin())return;
  if(!confirm('Delete this photo permanently?'))return;
  const {error:dbError}=await sb.from('photo_posts').delete().eq('id',postId);
  if(dbError){notify('Delete failed: '+dbError.message);return;}
  const {error:storageError}=await sb.storage.from(BUCKET).remove([path]);
  if(storageError)console.warn('Storage cleanup failed:',storageError.message);
  notify('Post deleted.');
  if(currentPage==='home')loadHome();
  else if(currentPage==='explore')loadExplore();
  else if(currentPage==='profile')loadProfile();
}

/* ---------- ACTIVITY ---------- */
async function loadActivity(){
  if(!currentUser){
    document.getElementById('app').innerHTML=`
      <div class="panel"><h2>Your activity</h2>
      <p class="muted">Login to view your saved photos and activity.</p>
      <button class="primary" onclick="openAuth()">Login</button></div>`;
    return;
  }
  document.getElementById('app').innerHTML=`
    <div class="section-head"><h2>Your Activity</h2></div>
    <div class="panel"><h3>Saved photos</h3><div id="savedGrid" class="grid">Loading...</div></div>`;
  const {data:saves,error}=await sb.from('photo_saves')
    .select('post_id').eq('user_id',currentUser.id)
    .order('created_at',{ascending:false}).limit(50);
  const box=document.getElementById('savedGrid');
  if(error){box.textContent=error.message;return;}
  if(!saves?.length){box.innerHTML='<p class="muted">No saved photos yet.</p>';return;}
  const ids=saves.map(x=>x.post_id);
  const {data:posts, error:postError}=await sb.from('photo_posts')
    .select('id,storage_path,caption').in('id',ids);
  if(postError){box.textContent=postError.message;return;}
  let html='';
  for(const p of posts||[]){
    const url=await getImageUrl(p.storage_path);
    if(url)html+=`<img src="${esc(url)}" alt="${esc(p.caption||'Saved photo')}" onclick="notify('${esc((p.caption||'Saved photo').replace(/'/g,''))}')">`;
  }
  box.innerHTML=html||'<p class="muted">No available saved photos.</p>';
}

/* ---------- PROFILE ---------- */
async function loadProfile(){
  if(!currentUser){
    document.getElementById('app').innerHTML=`
      <div class="panel"><h2>Your profile</h2>
      <p class="muted">Login or create an account to manage your profile and uploads.</p>
      <button class="primary" onclick="openAuth()">Login / Create account</button></div>`;
    return;
  }
  const name=currentUser.user_metadata?.display_name||currentUser.email?.split('@')[0]||'Member';
  const avatar=currentUser.user_metadata?.avatar_url||'';
  document.getElementById('app').innerHTML=`
    <div class="section-head"><h2>My Profile</h2></div>
    <div class="panel" style="text-align:center">
      ${avatar?`<img class="avatar" style="width:90px;height:90px;margin:auto" src="${esc(avatar)}">`:`<div class="avatar" style="width:90px;height:90px;margin:auto;font-size:28px">${esc(name.slice(0,1).toUpperCase())}</div>`}
      <h2>${esc(name)}</h2>
      <p class="muted">${esc(currentUser.email)}</p>
      <button class="secondary" onclick="editProfile()">Edit profile</button>
    </div>
    <div class="panel">
      <h3>My posts</h3><div id="myPosts"><p class="muted">Loading...</p></div>
    </div>
    <div class="panel">
      <h3>Account</h3>
      <button class="secondary" style="width:100%;margin:5px 0" onclick="go('activity')">Saved photos</button>
      <button class="secondary" style="width:100%;margin:5px 0" onclick="go('upload')">Upload a photo</button>
      <button class="danger" style="width:100%;margin:5px 0" onclick="signOut()">Sign out</button>
    </div>`;
  const {data:posts,error}=await sb.from('photo_posts')
    .select('id,storage_path,caption,created_at').eq('user_id',currentUser.id)
    .order('created_at',{ascending:false}).limit(30);
  const box=document.getElementById('myPosts');
  if(!box)return;
  if(error){box.textContent=error.message;return;}
  if(!posts?.length){box.innerHTML='<p class="muted">You have not shared any photos yet.</p>';return;}
  let html='<div class="grid">';
  for(const p of posts){
    const url=await getImageUrl(p.storage_path);
    if(url)html+=`<img src="${esc(url)}" alt="Your photo" onclick="notify('${esc((p.caption||'Your photo').replace(/'/g,''))}')">`;
  }
  box.innerHTML=html+'</div>';
}
function editProfile(){
  const name=currentUser.user_metadata?.display_name||'';
  showModal('Edit profile',`
    <label class="muted small">Display name</label>
    <input class="field" id="profileName" maxlength="40" value="${esc(name)}" placeholder="Your name">
    <label class="muted small">Profile picture</label>
    <input class="field" type="file" id="avatarFile" accept="image/*">
    <button class="primary" onclick="saveProfile()">Save changes</button>
    <p class="status" id="profileStatus"></p>`);
}
async function saveProfile(){
  const status=document.getElementById('profileStatus');
  status.textContent='Saving...';
  const name=document.getElementById('profileName').value.trim();
  const file=document.getElementById('avatarFile').files[0];
  let avatarPath=currentUser.user_metadata?.avatar_path||null;
  if(file){
    if(!file.type.startsWith('image/')||file.size>5*1024*1024){
      status.textContent='Choose an image smaller than 5 MB.';return;
    }
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    avatarPath=currentUser.id+'/avatars/'+Date.now()+'.'+ext;
    const {error}=await sb.storage.from(BUCKET).upload(avatarPath,file,{upsert:true,contentType:file.type});
    if(error){status.textContent=error.message;return;}
  }
  let avatarUrl=currentUser.user_metadata?.avatar_url||'';
  if(avatarPath)avatarUrl=await getImageUrl(avatarPath);
  const {data,error}=await sb.auth.updateUser({
    data:{display_name:name||'Member',avatar_path:avatarPath,avatar_url:avatarUrl}
  });
  if(error){status.textContent=error.message;return;}
  currentUser=data.user;
  closeModal();notify('Profile updated.');loadProfile();
}
async function signOut(){
  const {error}=await sb.auth.signOut();
  if(error){notify(error.message);return;}
  currentUser=null;notify('Signed out.');go('home');
}

/* ---------- INITIALIZE ---------- */
async function initialize(){
  const {data,error}=await sb.auth.getSession();
  if(error)console.error(error);
  currentUser=data?.session?.user||null;
  sb.auth.onAuthStateChange((_event,session)=>{
    currentUser=session?.user||null;
    if(currentPage==='profile')loadProfile();
    if(currentPage==='home')loadHome();
  });
  go('home');
}
initialize();
</script>
</body>
</html>
