
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09070f">
<title>Mahi Baby ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#09070f;
  --panel:#171220;
  --line:#30243f;
  --text:#fff7ff;
  --muted:#aa9bb8;
  --pink:#ff4fa3;
  --purple:#9865ff;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial, sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{
  height:65px;padding:0 18px;display:flex;
  align-items:center;justify-content:space-between;
  background:#110d19;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;
}
.brand{font-size:21px;font-weight:900}
.brand span{color:var(--pink)}
.layout{
  max-width:1200px;margin:22px auto;padding:0 16px;
  display:grid;grid-template-columns:210px 1fr;gap:22px;
}
.sidebar{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:12px;height:max-content;
  position:sticky;top:85px;
}
.navbtn{
  display:block;width:100%;text-align:left;padding:13px;
  margin:3px 0;border:0;border-radius:11px;
  background:transparent;color:var(--muted);font-weight:bold;
}
.navbtn.active,.navbtn:hover{
  color:white;background:linear-gradient(90deg,#55204d,#302044);
}
.main{min-width:0}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:17px;margin-bottom:15px;
}
h1{font-size:26px;margin:0 0 16px}
.muted{color:var(--muted)}
.btn{
  border:0;border-radius:11px;padding:11px 16px;
  background:linear-gradient(100deg,var(--pink),var(--purple));
  color:white;font-weight:bold;
}
.secondary{background:#292034;border:1px solid var(--line)}
.danger{background:#641c35}
.field{
  width:100%;padding:12px;margin:7px 0 14px;
  color:white;background:#0d0a13;
  border:1px solid var(--line);border-radius:10px;
}
label{font-size:13px;font-weight:bold}
.auth{
  max-width:430px;margin:8vh auto;padding:18px;
}
.auth .card{padding:25px}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
}
.stat{
  background:#20172b;border:1px solid var(--line);
  border-radius:14px;padding:15px;
}
.stat strong{display:block;font-size:24px}
.feed{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.post{padding:0;overflow:hidden}
.post img{
  width:100%;max-height:480px;object-fit:cover;
  display:block;background:#09070f;
}
.postbody{padding:13px}
.person{display:flex;align-items:center;gap:10px}
.avatar{
  width:42px;height:42px;border-radius:50%;
  object-fit:cover;background:#392744;
}
.avatar.big{width:85px;height:85px}
.notice{
  padding:11px;border-radius:10px;margin:10px 0;
  background:#281a35;border:1px solid var(--line);
}
.error{background:#351724;color:#ffd9e2}
.success{background:#123328;color:#caffea}
.empty{text-align:center;padding:35px;color:var(--muted)}
.mobile-nav{display:none}
.preview{
  width:100%;max-height:330px;object-fit:contain;
  background:#08060c;border-radius:12px;margin:10px 0;
}
@media(max-width:750px){
  .layout{display:block;padding:0 12px 85px}
  .sidebar{display:none}
  .feed{grid-template-columns:1fr}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    justify-content:space-around;background:#110d19;
    border-top:1px solid var(--line);
    padding:8px 3px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .mobile-nav button{
    background:none;border:0;color:var(--muted);
    font-size:11px;padding:5px;
  }
  .mobile-nav button.active{color:var(--pink)}
  .stats{gap:7px}
  .stat{padding:10px}
  .stat strong{font-size:19px}
}
</style>
</head>
<body>

<div id="authScreen" class="auth">
  <div class="card">
    <div class="brand">MAHI <span>BABY ❤️</span></div>
    <h1 id="authTitle">Welcome Back</h1>
    <p class="muted">Your personal photo community.</p>
    <div id="authMessage"></div>

    <form id="authForm">
      <label>Email</label>
      <input class="field" id="email" type="email" required>

      <label>Password</label>
      <input class="field" id="password" type="password"
       minlength="6" required>

      <div id="signupFields" class="hidden">
        <label>Your Name</label>
        <input class="field" id="signupName" maxlength="40">
      </div>

      <button class="btn" id="authSubmit" type="submit"
       style="width:100%">Sign In</button>
    </form>

    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn secondary" id="toggleAuth" type="button">
        Create Account
      </button>
      <button class="btn secondary" id="forgotBtn" type="button">
        Forgot Password
      </button>
    </div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="brand">MAHI <span>BABY ❤️</span></div>
    <div>
      <button class="btn secondary" id="uploadTop">＋ Upload</button>
      <button class="btn secondary" id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="desktopNav"></aside>
    <main class="main" id="mainContent"></main>
  </div>

  <nav class="mobile-nav" id="mobileNav"></nav>
</div>

<script>
const SUPABASE_URL = "https://jhvmqedhxkahjroyquty.supabase.co";
const SUPABASE_KEY = "sb_publishable_ItB77qS23ODZE5xlTCs5Xw_7AFljOyX";
const BUCKET = "mahi-photos";
const ADMIN_UID = "6b19250a-ab16-4e98-bae6-2f6473d8a4cb";

const db = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let user = null;
let profile = null;
let isAdmin = false;
let currentPage = "dashboard";
let signupMode = false;
let searchText = "";

const pages = [
  ["dashboard","⌂","Dashboard"],
  ["myphotos","▧","My Photos"],
  ["upload","＋","Upload"],
  ["activity","◷","Activity"],
  ["community","◎","Community"],
  ["profile","◉","My Profile"],
  ["settings","⚙","Settings"]
];

function escapeHTML(value=""){
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function message(id,text,type=""){
  $(id).innerHTML = text
    ? `<div class="notice ${type}">${escapeHTML(text)}</div>`
    : "";
}

function authMode(signup){
  signupMode = signup;
  $("authTitle").textContent = signup ? "Create Account" : "Welcome Back";
  $("authSubmit").textContent = signup ? "Create Account" : "Sign In";
  $("toggleAuth").textContent = signup
    ? "Already have an account?" : "Create Account";
  $("signupFields").classList.toggle("hidden",!signup);
  $("signupName").required = signup;
  message("authMessage","");
}
async function loadProfile(){
  const {data,error} = await db.from("profiles")
    .select("*").eq("user_id",user.id).maybeSingle();
  if(error) throw error;

  profile = data || {
    user_id:user.id,
    display_name:user.user_metadata?.display_name ||
      user.email.split("@")[0],
    avatar_path:null
  };
}

async function checkAdmin(){
  isAdmin = user.id === ADMIN_UID;
  if(!isAdmin){
    const {data} = await db.from("admins")
      .select("user_id").eq("user_id",user.id).maybeSingle();
    isAdmin = !!data;
  }
}

async function saveProfile(name,avatarPath){
  const update = {
    user_id:user.id,
    display_name:name.trim(),
    updated_at:new Date().toISOString()
  };
  if(avatarPath !== undefined) update.avatar_path = avatarPath;

  const {data,error} = await db.from("profiles")
    .upsert(update,{onConflict:"user_id"}).select().single();
  if(error) throw error;
  profile = data;
}

async function imageURL(path){
  if(!path) return "";
  const {data,error} = await db.storage.from(BUCKET)
    .createSignedUrl(path,3600);
  if(error) return "";
  return data.signedUrl;
}

function renderNavigation(){
  const items = isAdmin
    ? [...pages,["admin","♜","Admin Panel"]]
    : pages;

  const html = items.map(([key,icon,label]) =>
    `<button class="navbtn ${currentPage===key?"active":""}"
      data-page="${key}">${icon} &nbsp; ${label}</button>`
  ).join("");

  $("desktopNav").innerHTML = html;

  $("mobileNav").innerHTML = items
    .filter(x=>["dashboard","community","upload","myphotos","profile","admin"].includes(x[0]))
    .map(([key,icon,label]) =>
      `<button class="${currentPage===key?"active":""}"
       data-page="${key}">${icon}<br>${label}</button>`
    ).join("");

  document.querySelectorAll("[data-page]").forEach(button=>{
    button.onclick = ()=>openPage(button.dataset.page);
  });
}

async function getPosts(ownOnly=false){
  let query = db.from("photo_posts")
    .select("*").order("created_at",{ascending:false}).limit(100);

  if(ownOnly) query = query.eq("user_id",user.id);

  const {data,error} = await query;
  if(error) throw error;

  const ids = [...new Set(data.map(p=>p.user_id))];
  let profiles = [];

  if(ids.length){
    const result = await db.from("profiles")
      .select("user_id,display_name,avatar_path").in("user_id",ids);
    if(result.error) throw result.error;
    profiles = result.data || [];
  }

  const lookup = Object.fromEntries(
    profiles.map(p=>[p.user_id,p])
  );

  return Promise.all(data.map(async p=>{
    const person = lookup[p.user_id] || {};
    return {
      ...p,
      display_name:person.display_name || "Member",
      image:await imageURL(p.storage_path),
      avatar:await imageURL(person.avatar_path)
    };
  }));
}

function postHTML(p,admin=false){
  return `<article class="card post">
    <img src="${p.image}" alt="Shared photo">
    <div class="postbody">
      <div class="person">
        <img class="avatar" src="${p.avatar}" alt="">
        <div>
          <strong>${escapeHTML(p.display_name)}</strong>
          <div class="muted">${new Date(p.created_at).toLocaleString()}</div>
        </div>
      </div>
      <p>${escapeHTML(p.caption || "")}</p>
      ${admin ? `<button class="btn danger"
        data-delete="${p.id}"
        data-path="${escapeHTML(p.storage_path)}">Delete Post</button>` : ""}
    </div>
  </article>`;
}

function heading(title,subtitle=""){
  return `<h1>${title}</h1><p class="muted">${subtitle}</p>`;
}

async function openPage(page){
  if(page==="admin" && !isAdmin) return;

  currentPage = page;
  renderNavigation();
  await renderPage();
}

async function renderPage(){
  const main = $("mainContent");
  main.innerHTML = `<div class="card">Loading…</div>`;

  try{
    if(currentPage==="dashboard"){
      const posts = await getPosts();
      const mine = posts.filter(p=>p.user_id===user.id);

      main.innerHTML = heading("Dashboard","Welcome to Mahi Baby ❤️") +
        `<div class="stats">
          <div class="stat">Community Photos<strong>${posts.length}</strong></div>
          <div class="stat">My Photos<strong>${mine.length}</strong></div>
          <div class="stat">Account<strong>${isAdmin?"Admin":"Member"}</strong></div>
        </div>
        <div class="card" style="margin-top:18px">
          <h2>Recent Community Photos</h2>
          <button class="btn" id="communityButton">Explore Community</button>
        </div>
        <div class="feed">${posts.slice(0,4).map(p=>postHTML(p)).join("")}</div>`;

      $("communityButton").onclick=()=>openPage("community");
    }

    else if(["community","myphotos","admin"].includes(currentPage)){
      const admin = currentPage==="admin";
      const posts = await getPosts(currentPage==="myphotos");
      const filtered = posts.filter(p=>
        (p.caption||"").toLowerCase().includes(searchText) ||
        p.display_name.toLowerCase().includes(searchText)
      );

      main.innerHTML = heading(
        admin?"Admin Panel":currentPage==="myphotos"?"My Photos":"Community",
        admin?"Manage community posts":"Browse shared memories"
      ) +
      (!admin ? `<input class="field" id="searchPosts"
        placeholder="Search photos or members…">` : "") +
      `<div class="feed">${filtered.map(p=>postHTML(p,admin)).join("")}</div>` +
      (filtered.length?"":`<div class="card empty">No photos found.</div>`);

      const search = $("searchPosts");
      if(search){
        search.value=searchText;
        search.oninput=()=>{
          searchText=search.value.toLowerCase();
          renderPage();
        };
      }

      document.querySelectorAll("[data-delete]").forEach(button=>{
        button.onclick=async()=>{
          if(!confirm("Delete this photo permanently?")) return;
          button.disabled=true;
          const {error:storageError}=await db.storage.from(BUCKET)
            .remove([button.dataset.path]);
          if(storageError){
            alert(storageError.message);
            button.disabled=false;
            return;
          }
          const {error}=await db.from("photo_posts")
            .delete().eq("id",button.dataset.delete);
          if(error){
            alert(error.message);
            button.disabled=false;
            return;
          }
          renderPage();
        };
      });
    }

    else if(currentPage==="upload"){
      main.innerHTML = heading("Upload Photo","Share a new memory") +
        `<div class="card">
          <form id="uploadForm">
            <label>Select Photo</label>
            <input class="field" type="file" id="photoFile"
              accept="image/*" required>
            <img id="preview" class="preview hidden" alt="Preview">
            <label>Caption</label>
            <textarea class="field" id="caption"
              maxlength="500" rows="3"
              placeholder="Write a caption…"></textarea>
            <button class="btn" id="uploadButton">Upload Photo</button>
            <div id="uploadMessage"></div>
          </form>
        </div>`;

      $("photoFile").onchange=()=>{
        const file=$("photoFile").files[0];
        if(file){
          $("preview").src=URL.createObjectURL(file);
          $("preview").classList.remove("hidden");
        }
      };

      $("uploadForm").onsubmit=uploadPhoto;
    }

    else if(currentPage==="profile"){
      const avatar=await imageURL(profile.avatar_path);
      const posts=await getPosts(true);

      main.innerHTML=heading("My Profile","Your account details") +
        `<div class="card">
          <div class="person">
            <img class="avatar big" src="${avatar}" alt="Profile picture">
            <div><h2>${escapeHTML(profile.display_name||"Member")}</h2>
              <div class="muted">${escapeHTML(user.email)}</div>
            </div>
          </div>
          <form id="profileForm">
            <label>Display Name</label>
            <input class="field" id="displayName" required
              maxlength="40" value="${escapeHTML(profile.display_name||"")}">
            <label>Profile Picture</label>
            <input class="field" type="file" id="avatarFile" accept="image/*">
            <button class="btn">Save Profile</button>
            <div id="profileMessage"></div>
          </form>
        </div>
        <div class="card">Your uploaded photos: <strong>${posts.length}</strong></div>`;

      $("profileForm").onsubmit=saveMyProfile;
    }

    else if(currentPage==="activity"){
      const posts=await getPosts(true);
      main.innerHTML=heading("Activity","Your recent uploads") +
        `<div class="card">${posts.length ?
          posts.map(p=>`<p>📷 You uploaded a photo
            <br><span class="muted">${new Date(p.created_at).toLocaleString()}</span>
          </p>`).join("") :
          `<div class="empty">No activity yet.</div>`}</div>`;
    }

    else if(currentPage==="settings"){
      main.innerHTML=heading("Settings","Manage your account") +
        `<div class="card">
          <p>${escapeHTML(user.email)}</p>
          <button class="btn secondary" id="resetButton">Reset Password</button>
          <div id="settingsMessage"></div>
        </div>
        <div class="card">
          <button class="btn danger" id="settingsLogout">Logout</button>
        </div>`;

      $("resetButton").onclick=resetPassword;
      $("settingsLogout").onclick=logout;
    }

  }catch(error){
    main.innerHTML=heading("Page Error") +
      `<div class="notice error">${escapeHTML(error.message)}</div>
       <button class="btn secondary" id="retryButton">Retry</button>`;
    $("retryButton").onclick=renderPage;
  }
}

async function uploadPhoto(event){
  event.preventDefault();

  const file=$("photoFile").files[0];
  if(!file) return;

  const button=$("uploadButton");
  button.disabled=true;
  button.textContent="Uploading…";
  message("uploadMessage","");

  let uploadedPath=null;

  try{
    if(!file.type.startsWith("image/"))
      throw new Error("Please select an image.");
    if(file.size>15*1024*1024)
      throw new Error("Photo must be smaller than 15 MB.");

    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path=`${user.id}_${Date.now()}_${safeName}`;

    const upload=await db.storage.from(BUCKET)
      .upload(path,file,{upsert:false,contentType:file.type});

    if(upload.error) throw upload.error;
    uploadedPath=path;

    const insert=await db.from("photo_posts").insert({
      user_id:user.id,
      storage_path:path,
      caption:$("caption").value.trim()
    });

    if(insert.error) throw insert.error;

    message("uploadMessage","Photo uploaded successfully!","success");
    $("uploadForm").reset();
    $("preview").classList.add("hidden");

    setTimeout(()=>openPage("myphotos"),800);

  }catch(error){
    if(uploadedPath){
      await db.storage.from(BUCKET).remove([uploadedPath]);
    }
    message("uploadMessage",error.message||"Upload failed.","error");
  }finally{
    button.disabled=false;
    button.textContent="Upload Photo";
  }
}

async function saveMyProfile(event){
  event.preventDefault();

  const button=$("profileForm").querySelector("button");
  button.disabled=true;
  message("profileMessage","");

  try{
    const name=$("displayName").value.trim();
    if(!name) throw new Error("Please enter your name.");

    const file=$("avatarFile").files[0];
    let avatarPath=profile.avatar_path||null;

    if(file){
      if(!file.type.startsWith("image/"))
        throw new Error("Please select an image file.");
      if(file.size>8*1024*1024)
        throw new Error("Profile photo must be smaller than 8 MB.");

      const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      avatarPath=`${user.id}_${Date.now()}_avatar_${safeName}`;

      const upload=await db.storage.from(BUCKET)
        .upload(avatarPath,file,{
          upsert:false,
          contentType:file.type
        });

      if(upload.error) throw upload.error;
    }

    await saveProfile(name,avatarPath);
    message("profileMessage","Profile updated successfully!","success");

    setTimeout(()=>{
      renderNavigation();
      renderPage();
    },700);

  }catch(error){
    message("profileMessage",error.message||"Profile update failed.","error");
  }finally{
    button.disabled=false;
  }
}

async function resetPassword(){
  const {error}=await db.auth.resetPasswordForEmail(user.email);
  message(
    "settingsMessage",
    error?error.message:"Password reset email sent. Check your inbox.",
    error?"error":"success"
  );
}

async function logout(){
  const {error}=await db.auth.signOut();
  if(error){
    alert(error.message);
    return;
  }

  user=null;
  profile=null;
  isAdmin=false;
  $("appScreen").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
}

let bootingUserId=null;

async function boot(account){
  if(!account) return;
  if(bootingUserId===account.id) return;

  bootingUserId=account.id;
  user=account;

  try{
    await loadProfile();
    await checkAdmin();

    $("authScreen").classList.add("hidden");
    $("appScreen").classList.remove("hidden");

    await openPage("dashboard");

  }catch(error){
    $("authScreen").classList.add("hidden");
    $("appScreen").classList.remove("hidden");

    $("mainContent").innerHTML=
      `<div class="card">
        <h2>Account setup error</h2>
        <div class="notice error">${escapeHTML(error.message)}</div>
        <button class="btn" id="retryBoot">Try Again</button>
      </div>`;

    $("retryBoot").onclick=()=>boot(account);

  }finally{
    bootingUserId=null;
  }
}

$("authForm").addEventListener("submit",async event=>{
  event.preventDefault();

  const email=$("email").value.trim();
  const password=$("password").value;
  const button=$("authSubmit");

  button.disabled=true;
  message("authMessage","");

  try{
    if(signupMode){
      const name=$("signupName").value.trim();
      if(!name) throw new Error("Please enter your name.");

      const {data,error}=await db.auth.signUp({
        email,
        password,
        options:{
          data:{display_name:name}
        }
      });

      if(error) throw error;

      if(data.session){
        await boot(data.user);
      }else{
        message(
          "authMessage",
          "Account created. Verify your email if confirmation is required, then sign in.",
          "success"
        );
      }

    }else{
      const {data,error}=await db.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;
      await boot(data.user);
    }

  }catch(error){
    message("authMessage",error.message||"Login failed.","error");
  }finally{
    button.disabled=false;
  }
});

$("toggleAuth").addEventListener("click",()=>{
  authMode(!signupMode);
});

$("forgotBtn").addEventListener("click",async()=>{
  const email=$("email").value.trim();

  if(!email){
    message("authMessage","Enter your email address first.","error");
    return;
  }

  const {error}=await db.auth.resetPasswordForEmail(email);

  message(
    "authMessage",
    error?error.message:"Password reset email sent. Check your inbox.",
    error?"error":"success"
  );
});

$("logoutBtn").addEventListener("click",logout);
$("uploadTop").addEventListener("click",()=>openPage("upload"));

db.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT"){
    user=null;
    profile=null;
    isAdmin=false;
    $("appScreen").classList.add("hidden");
    $("authScreen").classList.remove("hidden");
  }else if(session?.user){
    setTimeout(()=>boot(session.user),0);
  }
});

(async()=>{
  authMode(false);

  const {data,error}=await db.auth.getSession();

  if(error){
    message("authMessage",error.message,"error");
    return;
  }

  if(data.session?.user){
    await boot(data.session.user);
  }else{
    $("authScreen").classList.remove("hidden");
  }
})();
                 
</script>
</body>
</html>
